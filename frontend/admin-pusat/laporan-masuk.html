<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Masuk — Admin Pusat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6fa; --white: #ffffff; --navy: #0f1f38;
      --blue: #185FA5; --blue-lt: #eff6ff; --blue-acc: #3b9eff;
      --text: #1e293b; --text-2: #64748b; --text-3: #94a3b8;
      --border: #e2e8f0; --border-2: #f1f5f9;
      --green: #16a34a; --green-lt: #f0fdf4; --green-bdr: #bbf7d0;
      --amber: #b45309; --amber-lt: #fffbeb; --amber-bdr: #fde68a;
      --red: #dc2626; --red-lt: #fef2f2; --red-bdr: #fecaca;
      --sidebar-w: 232px; --topbar-h: 56px; --radius: 10px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* ═══ SIDEBAR ═══ */
    .sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
    .sidebar-logo { padding: 1.375rem 1.375rem 1.125rem; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-icon svg { width: 17px; height: 17px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-text h2 { font-size: 13.5px; font-weight: 600; color: #fff; }
    .logo-text p  { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .nav-section { padding: 1.125rem 0 .375rem; flex: 1; overflow-y: auto; }
    .nav-label { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,0.25); padding: 0 1.375rem; margin-bottom: .375rem; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 1.375rem; font-size: 13px; color: rgba(255,255,255,0.5); text-decoration: none; border-left: 2px solid transparent; transition: background .15s, color .15s; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85); }
    .nav-item.active { color: #fff; background: rgba(59,158,255,0.12); border-left-color: var(--blue-acc); font-weight: 500; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; }
    .nav-item.active svg { opacity: 1; }
    /* Badge sidebar */
    .nav-badge { margin-left: auto; background: var(--red); color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; display: none; min-width: 18px; text-align: center; line-height: 16px; }
    .nav-badge.show { display: inline-block; }
    .nav-badge.blue { background: var(--blue-acc); }
    .user-box { padding: 1rem 1.375rem; border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: white; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 500; color: #fff; }
    .user-role { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 1px; }
    .btn-logout { margin-top: 4px; font-size: 11px; color: rgba(255,100,100,0.7); cursor: pointer; background: none; border: none; padding: 0; font-family: 'DM Sans', sans-serif; transition: color .15s; }
    .btn-logout:hover { color: #f87171; }

    /* ═══ MAIN ═══ */
    .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--white); border-bottom: 1px solid var(--border); height: var(--topbar-h); padding: 0 1.75rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .content { padding: 1.75rem; flex: 1; }

    /* ═══ FILTER ═══ */
    .filter-bar { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: .875rem 1.25rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .filter-label { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
    select, input[type="number"] { padding: 6px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 12.5px; font-family: 'DM Sans', sans-serif; color: var(--text); background: var(--white); outline: none; }
    select:focus, input:focus { border-color: var(--blue-acc); }

    /* ═══ BUTTONS ═══ */
    .btn { font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500; padding: 6px 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--white); color: var(--text-2); cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
    .btn:hover { background: var(--bg); color: var(--text); }
    .btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-blue  { background: var(--blue); color: white; border-color: var(--blue); }
    .btn-blue:hover  { background: #1248a0; color: white; }
    .btn-green { background: var(--green); color: white; border-color: var(--green); }
    .btn-green:hover { background: #15803d; color: white; }
    .btn-sm { font-size: 11.5px; padding: 5px 10px; }

    /* ═══ LAPORAN LIST ═══ */
    .laporan-list { display: flex; flex-direction: column; gap: 1rem; }
    .laporan-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; animation: fadeUp .3s ease both; }
    .laporan-card.terkirim { border-left: 3px solid var(--blue-acc); }
    .laporan-card.diproses { border-left: 3px solid var(--amber); }
    .laporan-card.selesai  { border-left: 3px solid var(--green); }

    .lap-hdr { display: flex; align-items: flex-start; gap: 12px; padding: 1rem 1.25rem; }
    .lap-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .dot-terkirim { background: var(--blue-acc); box-shadow: 0 0 0 3px rgba(59,158,255,.15); }
    .dot-diproses { background: var(--amber); }
    .dot-selesai  { background: var(--green); }
    .dot-default  { background: var(--border); }

    .lap-info { flex: 1; min-width: 0; }
    .lap-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .lap-meta  { font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lap-meta span { display: flex; align-items: center; gap: 4px; }
    .lap-meta svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    .lap-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 99px; flex-shrink: 0; }
    .lb-terkirim { background: var(--blue-lt);  color: var(--blue);  border: 1px solid #bfdbfe; }
    .lb-diproses { background: var(--amber-lt); color: var(--amber); border: 1px solid var(--amber-bdr); }
    .lb-selesai  { background: var(--green-lt); color: var(--green); border: 1px solid var(--green-bdr); }
    .lb-draft    { background: var(--border-2); color: var(--text-3); border: 1px solid var(--border); }

    .lap-detail { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border-2); border-top: 1px solid var(--border-2); border-bottom: 1px solid var(--border-2); }
    .ld-cell { background: var(--white); padding: .75rem 1.25rem; }
    .ld-label { font-size: 10.5px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
    .ld-val   { font-size: 14px; font-weight: 600; font-family: 'DM Mono', monospace; }
    .ld-val.blue  { color: var(--blue); }
    .ld-val.green { color: var(--green); }
    .ld-val.amber { color: var(--amber); }

    .lap-ftr { padding: .875rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .lap-ftr-left  { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .lap-ftr-left svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .lap-ftr-right { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ═══ DETAIL PANEL ═══ */
    .detail-overlay { position: fixed; inset: 0; background: rgba(15,31,56,.55); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: flex-start; justify-content: flex-end; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .detail-overlay.show { opacity: 1; pointer-events: all; }
    /* FIX pointer-events: panel tidak blok klik saat tertutup */
    .detail-panel { width: 560px; max-width: 96vw; height: 100vh; background: var(--white); overflow-y: auto; transform: translateX(100%); transition: transform .28s cubic-bezier(.16,1,.3,1); pointer-events: none; display: flex; flex-direction: column; }
    .detail-overlay.show .detail-panel { transform: translateX(0); pointer-events: all; }

    .dp-hdr { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-2); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--white); z-index: 5; }
    .dp-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .dp-close { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .dp-close svg { width: 14px; height: 14px; stroke: var(--text-2); fill: none; stroke-width: 2; stroke-linecap: round; }
    .dp-body { padding: 1.5rem; flex: 1; }
    .dp-section { margin-bottom: 1.5rem; }
    .dp-section-title { font-size: 10.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .875rem; }
    .dp-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dp-info-item .dpi-label { font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
    .dp-info-item .dpi-val   { font-size: 13px; font-weight: 500; color: var(--text); }

    /* WO table */
    .wo-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .wo-tbl th { text-align: left; padding: 7px 10px; font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; background: var(--bg); border-bottom: 1px solid var(--border-2); }
    .wo-tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border-2); color: var(--text-2); }
    .wo-tbl tr:last-child td { border-bottom: none; }
    .upah-col { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--blue); }

    .total-box { background: var(--blue-lt); border: 1px solid #bfdbfe; border-radius: 8px; padding: .875rem 1rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .tb-label { font-size: 13px; font-weight: 500; color: var(--blue); }
    .tb-val   { font-size: 18px; font-weight: 700; color: var(--blue); font-family: 'DM Mono', monospace; }

    /* Potongan */
    .potongan-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .pot-row { display: grid; grid-template-columns: 1fr 1.2fr 1fr auto; gap: 8px; align-items: end; }
    .pot-row label { font-size: 11px; font-weight: 600; color: var(--text-3); margin-bottom: 3px; display: block; }
    .pot-row input, .pot-row select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; font-size: 12.5px; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; }
    .pot-row input:focus, .pot-row select:focus { border-color: var(--blue-acc); }
    .btn-rm { width: 32px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 7px; border: 1px solid var(--red-bdr); background: var(--white); cursor: pointer; color: var(--red); font-size: 18px; flex-shrink: 0; }
    .btn-rm:hover { background: var(--red-lt); }

    .gaji-preview { background: var(--green-lt); border: 1px solid var(--green-bdr); border-radius: 8px; padding: .875rem 1rem; display: flex; align-items: center; justify-content: space-between; margin-top: .5rem; }
    .gp-label { font-size: 13px; font-weight: 600; color: var(--green); }
    .gp-val   { font-size: 18px; font-weight: 700; color: var(--green); font-family: 'DM Mono', monospace; }

    /* ═══ UPLOAD SCREENSHOT ═══ */
    .upload-section { margin-top: 1.5rem; }
    .upload-section-title { font-size: 10.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .75rem; display: block; }

    .date-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; margin-bottom: 10px; }
    .date-input:focus { border-color: var(--blue-acc); }

    /* Tab pilih metode */
    .upload-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
    .upload-tab { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--white); color: var(--text-3); cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 5px; }
    .upload-tab:hover { background: var(--bg); color: var(--text-2); }
    .upload-tab.active { background: var(--blue-lt); color: var(--blue); border-color: #bfdbfe; font-weight: 600; }
    .upload-tab svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .upload-tab-content { display: none; }
    .upload-tab-content.show { display: block; }

    /* Drop zone */
    .drop-zone { border: 2px dashed var(--border); border-radius: 9px; background: var(--bg); padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; position: relative; }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--blue-acc); background: var(--blue-lt); }
    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .dz-icon { width: 32px; height: 32px; stroke: var(--text-3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin: 0 auto 8px; display: block; }
    .drop-zone.dragover .dz-icon { stroke: var(--blue-acc); }
    .dz-text { font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 3px; }
    .dz-sub  { font-size: 11.5px; color: var(--text-3); }
    .dz-sub span { color: var(--blue); font-weight: 500; }

    /* Preview foto */
    .foto-preview { display: none; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--bg); }
    .foto-preview.show { display: block; }
    .preview-img-wrap { position: relative; }
    .preview-img-wrap img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
    .preview-overlay { position: absolute; inset: 0; background: rgba(15,31,56,0); display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s; }
    .preview-img-wrap:hover .preview-overlay { background: rgba(15,31,56,0.45); }
    .btn-preview-act { opacity: 0; transform: scale(.9); transition: opacity .2s, transform .2s; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 7px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .preview-img-wrap:hover .btn-preview-act { opacity: 1; transform: scale(1); }
    .btn-preview-act.ganti { background: white; color: var(--text); }
    .btn-preview-act.hapus { background: var(--red); color: white; }
    .btn-preview-act svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .preview-info { padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-2); }
    .preview-info-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .preview-info-size { color: var(--text-3); flex-shrink: 0; }

    /* Upload progress */
    .upload-progress { margin-top: 8px; display: none; }
    .upload-progress.show { display: block; }
    .progress-bar-wrap { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--blue-acc); border-radius: 99px; width: 0%; transition: width .3s ease; }
    .progress-text { font-size: 11px; color: var(--text-3); margin-top: 4px; display: flex; justify-content: space-between; }

    /* Upload status */
    .upload-status { display: none; margin-top: 8px; padding: 8px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; align-items: center; gap: 8px; }
    .upload-status.show { display: flex; }
    .upload-status.sukses { background: var(--green-lt); color: var(--green); border: 1px solid var(--green-bdr); }
    .upload-status.error  { background: var(--red-lt);   color: var(--red);   border: 1px solid var(--red-bdr); }
    .upload-status svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }

    /* URL manual input */
    .url-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; }
    .url-input:focus { border-color: var(--blue-acc); }
    .url-hint { font-size: 11.5px; color: var(--text-3); margin-top: 5px; }

    /* Footer panel */
    .dp-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-2); display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--white); }

    /* Error box */
    .error-msg { background: var(--red-lt); border: 1px solid var(--red-bdr); border-radius: 7px; padding: 8px 12px; font-size: 13px; color: var(--red); margin-bottom: 1rem; display: none; }

    /* ═══ STATE ═══ */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 1rem; gap: 10px; text-align: center; }
    .state-box svg { width: 40px; height: 40px; stroke: var(--text-3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .state-title { font-size: 14px; font-weight: 600; color: var(--text-2); }
    .state-sub   { font-size: 13px; color: var(--text-3); max-width: 320px; line-height: 1.6; }
    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 4rem; }
    .spinner { width: 26px; height: 26px; border: 2.5px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
    .spin-sm { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.35); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; }

    /* ═══ TOAST ═══ */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--navy); color: white; padding: 12px 16px; border-radius: 10px; font-size: 13px; display: none; z-index: 999; max-width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); animation: fadeUp .25s ease; }
    .toast.success { background: var(--green); }
    .toast.error   { background: var(--red); }
    .toast.info    { background: var(--blue); }
    .toast-row     { display: flex; align-items: flex-start; gap: 9px; }
    .toast-icon svg { width: 15px; height: 15px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .toast-body  { display: flex; flex-direction: column; gap: 2px; }
    .toast-title { font-weight: 600; font-size: 13px; }
    .toast-sub   { font-size: 11.5px; opacity: .85; }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<!-- ═══════════════════════════════════ SCRIPTS ═══════════════════════════════════ -->
<script src="/shared/auth.js"></script>
<script>
if (!requireAuth("admin_pusat")) throw new Error("Unauthorized");
initUserInfo();

// ── Konstanta & State global ──────────────────────────────────────────────
const BLN = ["","Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

let laporanAktif    = null;   // id laporan yang sedang dibuka
let jenisPotongan   = [];
let totalGajiAktif  = 0;
let rekapDataAktif  = null;   // simpan data laporan aktif untuk notifikasi
let fotoFile        = null;   // File object dipilih user
let fotoUploadedUrl = null;   // URL setelah upload berhasil
let toastTimer      = null;

// ── Helper: format rupiah ─────────────────────────────────────────────────
// (fungsi rupiah sudah ada di auth.js, jika tidak ada tambahkan di sini)
function escHtml(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function formatBytes(b) {
  if (b < 1024)        return b + " B";
  if (b < 1024*1024)   return (b/1024).toFixed(1) + " KB";
  return (b/(1024*1024)).toFixed(1) + " MB";
}

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(title, type = "info", sub = "") {
  if (toastTimer) clearTimeout(toastTimer);
  const icons = {
    success: `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
    error:   `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
    info:    `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  };
  document.getElementById("toast-icon").innerHTML  = icons[type] || icons.info;
  document.getElementById("toast-title").textContent = title;
  const subEl = document.getElementById("toast-sub");
  subEl.textContent   = sub;
  subEl.style.display = sub ? "block" : "none";
  const t = document.getElementById("toast");
  t.className     = `toast ${type}`;
  t.style.display = "block";
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 4500);
}

// ── Update badge sidebar ──────────────────────────────────────────────────
function updateBadgeLaporan(n) {
  const el = document.getElementById("badge-laporan");
  if (n > 0) { el.textContent = n; el.classList.add("show"); }
  else el.classList.remove("show");
}

async function loadBadgeNotifikasi() {
  // Coba load notifikasi yang belum dibaca (sesuaikan endpoint)
  const data = await apiFetch("/admin-pusat/notifikasi?belum_dibaca=1").catch(() => null);
  if (!data?.success) return;
  const n  = data.data?.length ?? 0;
  const el = document.getElementById("badge-notifikasi");
  if (n > 0) { el.textContent = n; el.classList.add("show"); }
  else el.classList.remove("show");
}

// ── Load cabang filter ────────────────────────────────────────────────────
async function loadCabang() {
  const data = await apiFetch("/admin-pusat/master/cabang");
  if (!data?.success) return;
  const sel = document.getElementById("filter-cabang");
  sel.innerHTML = '<option value="">Semua Cabang</option>' +
    data.data.map(c => `<option value="${c.id}">${escHtml(c.nama_cabang)}</option>`).join("");
}

// ── Load jenis potongan ───────────────────────────────────────────────────
async function loadJenisPotongan() {
  const data = await apiFetch("/admin-pusat/master/jenis-potongan");
  if (data?.success) jenisPotongan = data.data;
}

// ── Load laporan masuk ────────────────────────────────────────────────────
async function loadLaporan() {
  const bulan  = document.getElementById("filter-bulan").value;
  const tahun  = document.getElementById("filter-tahun").value;
  const status = document.getElementById("filter-status").value;
  const cabang = document.getElementById("filter-cabang").value;

  const qs = [];
  if (bulan)  qs.push(`bulan=${bulan}`);
  if (tahun)  qs.push(`tahun=${tahun}`);
  if (status) qs.push(`status=${status}`);
  if (cabang) qs.push(`cabang_id=${cabang}`);

  document.getElementById("laporan-list").innerHTML =
    '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const data = await apiFetch(`/admin-pusat/laporan-masuk${qs.length ? "?" + qs.join("&") : ""}`);

  if (!data?.success) {
    document.getElementById("laporan-list").innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="state-title">Gagal memuat data</div>
        <div class="state-sub">Periksa koneksi dan coba lagi</div>
        <button class="btn btn-sm" onclick="loadLaporan()" style="margin-top:8px">Coba Lagi</button>
      </div>`;
    return;
  }

  // Update badge laporan (hanya yang berstatus terkirim / perlu verifikasi)
  const jmlTerkirim = data.data.filter(r => r.status === "terkirim").length;
  updateBadgeLaporan(jmlTerkirim);
  document.getElementById("info-badge").textContent =
    data.data.length > 0 ? `${data.data.length} laporan ditemukan` : "";

  if (data.data.length === 0) {
    document.getElementById("laporan-list").innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div class="state-title">Tidak ada laporan</div>
        <div class="state-sub">Belum ada laporan masuk sesuai filter yang dipilih</div>
      </div>`;
    return;
  }

  document.getElementById("laporan-list").innerHTML = "";
  data.data.forEach((r, i) => {
    document.getElementById("laporan-list").appendChild(buatKartu(r, i));
  });
}

// ── Buat kartu laporan ────────────────────────────────────────────────────
function buatKartu(r, i) {
  const dotClass   = { terkirim:"dot-terkirim", diproses:"dot-diproses", selesai:"dot-selesai" }[r.status] || "dot-default";
  const badgeClass = { terkirim:"lb-terkirim",  diproses:"lb-diproses",  selesai:"lb-selesai"  }[r.status] || "lb-draft";
  const statusLabel = { terkirim:"Perlu Verifikasi", diproses:"Diproses", selesai:"Selesai" }[r.status] || r.status;

  // Aksi sesuai status:
  // terkirim  → tombol "Verifikasi & Proses"
  // diproses  → tombol "Buat Rekap & Bayar"
  // selesai   → label saja
  let aksiHtml = "";
  if (r.status === "terkirim") {
    aksiHtml = `<button class="btn btn-blue btn-sm" onclick="prosesLaporan(${r.id})">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Verifikasi & Proses
    </button>`;
  } else if (r.status === "diproses") {
    aksiHtml = `<button class="btn btn-green btn-sm" onclick="bukaPanel(${r.id})">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Buat Rekap & Bayar
    </button>`;
  }

  const div = document.createElement("div");
  div.className = `laporan-card ${r.status}`;
  div.style.animationDelay = `${i * 0.055}s`;
  div.innerHTML = `
    <div class="lap-hdr">
      <div class="lap-dot ${dotClass}"></div>
      <div class="lap-info">
        <div class="lap-title">${escHtml(r.nama_teknisi)}
          <span style="font-weight:400;color:var(--text-3)">— ${escHtml(r.nama_cabang)}</span>
        </div>
        <div class="lap-meta">
          <span>
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${escHtml(r.nama_provider)}
          </span>
          <span>·</span>
          <span>${escHtml(r.nama_project)} › ${escHtml(r.sub_project)}</span>
          <span>·</span>
          <span>
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${BLN[r.bulan]} ${r.tahun}
          </span>
          <span>·</span>
          <span>dari <strong>${escHtml(r.nama_admin_cabang)}</strong></span>
        </div>
      </div>
      <span class="lap-badge ${badgeClass}">${statusLabel}</span>
    </div>

    <div class="lap-detail">
      <div class="ld-cell">
        <div class="ld-label">Tipe</div>
        <div class="ld-val" style="font-size:13px;font-family:'DM Sans'">${r.tipe_pembayaran === "per_wo" ? "Per WO" : "Gaji Tetap"}</div>
      </div>
      <div class="ld-cell">
        <div class="ld-label">Total Upah</div>
        <div class="ld-val blue">${rupiah(r.total_upah)}</div>
      </div>
      <div class="ld-cell">
        <div class="ld-label">Cabang</div>
        <div class="ld-val" style="font-size:13px;font-family:'DM Sans'">${escHtml(r.nama_cabang)}</div>
      </div>
      <div class="ld-cell">
        <div class="ld-label">ID Laporan</div>
        <div class="ld-val amber">#${r.id}</div>
      </div>
    </div>

    <div class="lap-ftr">
      <div class="lap-ftr-left">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Laporan #${r.id}
      </div>
      <div class="lap-ftr-right">${aksiHtml}</div>
    </div>`;
  return div;
}

// ── Verifikasi laporan: terkirim → diproses ───────────────────────────────
async function prosesLaporan(id) {
  if (!confirm(`Verifikasi dan proses laporan #${id}?`)) return;
  const res = await apiFetch(`/admin-pusat/laporan-masuk/${id}/proses`, { method: "PATCH" });
  if (res?.success) {
    showToast("Laporan diproses", "success", `Laporan #${id} siap dibuatkan rekap gaji`);
    await loadLaporan();
    bukaPanel(id);
  } else {
    showToast(res?.message || "Gagal memproses laporan", "error");
  }
}

// ── Buka panel rekap gaji ─────────────────────────────────────────────────
async function bukaPanel(id) {
  laporanAktif    = id;
  rekapDataAktif  = null;
  fotoFile        = null;
  fotoUploadedUrl = null;

  document.getElementById("dp-title").textContent   = `Rekap Gaji — Laporan #${id}`;
  document.getElementById("dp-body").innerHTML       = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  document.getElementById("dp-footer").innerHTML     = "";
  document.getElementById("detail-overlay").classList.add("show");
  document.body.style.overflow = "hidden";

  const data = await apiFetch(`/admin-pusat/laporan-masuk/${id}`);
  if (!data?.success) {
    document.getElementById("dp-body").innerHTML =
      `<div class="state-box"><div class="state-title">Gagal memuat detail</div><div class="state-sub">${escHtml(data?.message || "")}</div></div>`;
    return;
  }

  const { laporan, detail, total_gaji } = data.data;
  totalGajiAktif = parseFloat(total_gaji) || 0;
  rekapDataAktif = { laporan, total_gaji };

  // ── Rincian WO ─────────────────────────────────────────────────────────
  let woHtml = "";
  if (laporan.tipe_pembayaran === "per_wo") {
    woHtml = `<table class="wo-tbl">
      <thead><tr><th>Jml WO</th><th>Jml Teknisi</th><th>Upah Dihitung</th></tr></thead>
      <tbody>${detail.map(d => `
        <tr>
          <td>${d.jumlah_wo} WO</td>
          <td>${d.jumlah_teknisi} Teknisi</td>
          <td class="upah-col">${rupiah(d.upah_dihitung)}</td>
        </tr>`).join("")}
      </tbody></table>`;
  } else {
    woHtml = `<div style="background:var(--blue-lt);border:1px solid #bfdbfe;border-radius:8px;padding:.75rem 1rem;font-size:13px;color:var(--blue);font-weight:500">
      Gaji Tetap: ${rupiah(detail[0]?.upah_dihitung || 0)}
    </div>`;
  }

  const potOpts = jenisPotongan.map(j => `<option value="${j.id}">${escHtml(j.nama)}</option>`).join("");

  document.getElementById("dp-body").innerHTML = `
    <!-- Info Laporan -->
    <div class="dp-section">
      <div class="dp-section-title">Informasi Laporan</div>
      <div class="dp-info-grid">
        <div class="dp-info-item"><div class="dpi-label">Teknisi</div><div class="dpi-val">${escHtml(laporan.nama_teknisi)}</div></div>
        <div class="dp-info-item"><div class="dpi-label">Cabang</div><div class="dpi-val">${escHtml(laporan.nama_cabang)}</div></div>
        <div class="dp-info-item"><div class="dpi-label">Provider</div><div class="dpi-val">${escHtml(laporan.nama_provider)}</div></div>
        <div class="dp-info-item"><div class="dpi-label">Sub Project</div><div class="dpi-val">${escHtml(laporan.sub_project)}</div></div>
        <div class="dp-info-item"><div class="dpi-label">Periode</div><div class="dpi-val">${BLN[laporan.bulan]} ${laporan.tahun}</div></div>
        <div class="dp-info-item"><div class="dpi-label">Tipe</div><div class="dpi-val">${laporan.tipe_pembayaran === "per_wo" ? "Per WO" : "Gaji Tetap"}</div></div>
      </div>
    </div>

    <!-- Rincian WO -->
    <div class="dp-section">
      <div class="dp-section-title">Rincian WO</div>
      ${woHtml}
    </div>

    <!-- Total Kotor -->
    <div class="total-box">
      <span class="tb-label">Total Gaji Kotor</span>
      <span class="tb-val">${rupiah(total_gaji)}</span>
    </div>

    <!-- Potongan -->
    <div class="dp-section">
      <div class="dp-section-title">Potongan Gaji</div>
      <div id="error-rekap" class="error-msg"></div>
      <div class="potongan-rows" id="potongan-rows">
        <div class="pot-row">
          <div><label>Jenis Potongan</label><select class="pot-jenis">${potOpts}</select></div>
          <div><label>Keterangan</label><input type="text" class="pot-ket" placeholder="Keterangan..."></div>
          <div><label>Nominal (Rp)</label><input type="number" class="pot-nominal" placeholder="0" oninput="hitungBersih()"></div>
          <button class="btn-rm" onclick="hapusPot(this)">×</button>
        </div>
      </div>
      <button class="btn btn-sm" onclick="tambahPot()" style="margin-top:4px">+ Tambah Potongan</button>
      <div class="gaji-preview" style="margin-top:1rem">
        <span class="gp-label">Gaji Bersih</span>
        <span class="gp-val" id="gaji-bersih-preview">${rupiah(total_gaji)}</span>
      </div>
    </div>

    <!-- Upload Bukti Transfer -->
    <div class="upload-section">
      <span class="upload-section-title">Bukti Transfer</span>

      <!-- Tanggal transfer -->
      <input type="date" class="date-input" id="tgl-transfer"
             value="${new Date().toISOString().slice(0,10)}" placeholder="Tanggal Transfer">

      <!-- Tab pilih metode -->
      <div class="upload-tabs">
        <button class="upload-tab active" id="tab-foto" onclick="gantiTabUpload('foto')">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Upload Foto
        </button>
        <button class="upload-tab" id="tab-url" onclick="gantiTabUpload('url')">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          URL Manual
        </button>
      </div>

      <!-- Panel: Upload Foto -->
      <div class="upload-tab-content show" id="panel-foto">

        <!-- Drop zone -->
        <div class="drop-zone" id="drop-zone"
             ondragover="dzDragOver(event)" ondragleave="dzDragLeave(event)" ondrop="dzDrop(event)">
          <input type="file" id="file-input" accept="image/*" onchange="pilihanFile(this.files[0])">
          <svg class="dz-icon" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <div class="dz-text">Seret foto ke sini</div>
          <div class="dz-sub">atau <span>klik untuk pilih file</span> · JPG, PNG, WEBP maks. 5 MB</div>
        </div>

        <!-- Preview -->
        <div class="foto-preview" id="foto-preview">
          <div class="preview-img-wrap">
            <img id="preview-img" src="" alt="Preview">
            <div class="preview-overlay">
              <button class="btn-preview-act ganti" onclick="document.getElementById('file-input-ganti').click()">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/></svg>
                Ganti
              </button>
              <button class="btn-preview-act hapus" onclick="hapusFoto()">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
                Hapus
              </button>
            </div>
          </div>
          <div class="preview-info">
            <span class="preview-info-name" id="preview-name">—</span>
            <span class="preview-info-size" id="preview-size">—</span>
          </div>
        </div>
        <input type="file" id="file-input-ganti" accept="image/*" style="display:none" onchange="pilihanFile(this.files[0])">

        <!-- Progress bar -->
        <div class="upload-progress" id="upload-progress">
          <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
          <div class="progress-text">
            <span id="progress-label">Mengupload...</span>
            <span id="progress-pct">0%</span>
          </div>
        </div>

        <!-- Status setelah upload -->
        <div class="upload-status" id="upload-status">
          <svg viewBox="0 0 24 24" id="upload-status-icon"></svg>
          <span id="upload-status-text"></span>
        </div>
      </div>

      <!-- Panel: URL Manual -->
      <div class="upload-tab-content" id="panel-url">
        <input type="text" class="url-input" id="screenshot-url"
               placeholder="https://... URL screenshot bukti transfer">
        <div class="url-hint">Paste URL gambar yang sudah diupload di tempat lain</div>
      </div>
    </div>`;

  // Footer tombol
  document.getElementById("dp-footer").innerHTML = `
    <button class="btn" onclick="tutupPanel()">Batal</button>
    <button class="btn btn-green" id="btn-simpan-rekap" onclick="simpanRekap()">
      <svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>
      Simpan & Tandai Dibayar
    </button>`;

  hitungBersih();
}

// ── Hitung gaji bersih real-time ──────────────────────────────────────────
function hitungBersih() {
  const totalPot = [...document.querySelectorAll(".pot-nominal")]
    .reduce((a, i) => a + (parseFloat(i.value) || 0), 0);
  const bersih = Math.max(0, totalGajiAktif - totalPot);
  const el = document.getElementById("gaji-bersih-preview");
  if (el) el.textContent = rupiah(bersih);
}

// ── Potongan ──────────────────────────────────────────────────────────────
function tambahPot() {
  const potOpts = jenisPotongan.map(j => `<option value="${j.id}">${escHtml(j.nama)}</option>`).join("");
  const div = document.createElement("div");
  div.className = "pot-row";
  div.innerHTML = `
    <div><label>Jenis Potongan</label><select class="pot-jenis">${potOpts}</select></div>
    <div><label>Keterangan</label><input type="text" class="pot-ket" placeholder="Keterangan..."></div>
    <div><label>Nominal (Rp)</label><input type="number" class="pot-nominal" placeholder="0" oninput="hitungBersih()"></div>
    <button class="btn-rm" onclick="hapusPot(this)">×</button>`;
  document.getElementById("potongan-rows").appendChild(div);
}

function hapusPot(el) {
  const rows = document.querySelectorAll(".pot-row");
  if (rows.length > 1) { el.closest(".pot-row").remove(); hitungBersih(); }
}

// ── Upload tab ────────────────────────────────────────────────────────────
function gantiTabUpload(tab) {
  document.getElementById("tab-foto").classList.toggle("active", tab === "foto");
  document.getElementById("tab-url").classList.toggle("active",  tab === "url");
  document.getElementById("panel-foto").classList.toggle("show", tab === "foto");
  document.getElementById("panel-url").classList.toggle("show",  tab === "url");
}

// ── Drag & Drop ───────────────────────────────────────────────────────────
function dzDragOver(e) { e.preventDefault(); document.getElementById("drop-zone").classList.add("dragover"); }
function dzDragLeave()  { document.getElementById("drop-zone").classList.remove("dragover"); }
function dzDrop(e) {
  e.preventDefault();
  document.getElementById("drop-zone").classList.remove("dragover");
  const file = e.dataTransfer?.files?.[0];
  if (file) pilihanFile(file);
}

// ── File dipilih ──────────────────────────────────────────────────────────
function pilihanFile(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    showToast("Format tidak didukung", "error", "Pilih file gambar (JPG, PNG, WEBP)"); return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast("File terlalu besar", "error", "Ukuran maksimal 5 MB"); return;
  }

  fotoFile        = file;
  fotoUploadedUrl = null;

  // Preview lokal
  const reader = new FileReader();
  reader.onload = e => { document.getElementById("preview-img").src = e.target.result; };
  reader.readAsDataURL(file);

  document.getElementById("preview-name").textContent = file.name;
  document.getElementById("preview-size").textContent = formatBytes(file.size);
  document.getElementById("drop-zone").style.display  = "none";
  document.getElementById("foto-preview").classList.add("show");
  document.getElementById("upload-progress").classList.remove("show");

  // Reset status
  const st = document.getElementById("upload-status");
  st.className = "upload-status";
}

function hapusFoto() {
  fotoFile        = null;
  fotoUploadedUrl = null;
  document.getElementById("file-input").value        = "";
  document.getElementById("file-input-ganti").value  = "";
  document.getElementById("drop-zone").style.display = "";
  document.getElementById("foto-preview").classList.remove("show");
  document.getElementById("upload-progress").classList.remove("show");
  document.getElementById("upload-status").className = "upload-status";
}

// ── Upload foto ke server via /api/upload/screenshot ──────────────────────
async function uploadFoto(file) {
  const prog = document.getElementById("upload-progress");
  const bar  = document.getElementById("progress-bar");
  const pct  = document.getElementById("progress-pct");
  const lbl  = document.getElementById("progress-label");

  prog.classList.add("show");
  bar.style.width = "0%";
  pct.textContent = "0%";
  lbl.textContent = "Mengupload...";

  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append("screenshot", file);

    const xhr = new XMLHttpRequest();

    xhr.upload.addEventListener("progress", e => {
      if (e.lengthComputable) {
        const p = Math.round(e.loaded / e.total * 100);
        bar.style.width = p + "%";
        pct.textContent = p + "%";
      }
    });

    xhr.addEventListener("load", () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const res = JSON.parse(xhr.responseText);
          if (res.success && res.url) {
            bar.style.width = "100%";
            pct.textContent = "100%";
            lbl.textContent = "Upload selesai ✓";

            // Tampilkan status sukses
            const st = document.getElementById("upload-status");
            document.getElementById("upload-status-icon").innerHTML =
              `<polyline points="20 6 9 17 4 12"/>`;
            document.getElementById("upload-status-text").textContent = `Berhasil diupload: ${res.filename}`;
            st.className = "upload-status sukses show";

            resolve(res.url);
          } else {
            reject(new Error(res.message || "Respons tidak valid"));
          }
        } catch { reject(new Error("Gagal memproses respons server")); }
      } else {
        reject(new Error(`Upload gagal (HTTP ${xhr.status})`));
      }
    });

    xhr.addEventListener("error", () => reject(new Error("Koneksi terputus saat upload")));

    const token = localStorage.getItem("auth_token") || sessionStorage.getItem("auth_token") || "";
    xhr.open("POST", "/api/upload/screenshot");
    if (token) xhr.setRequestHeader("Authorization", `Bearer ${token}`);
    xhr.send(fd);
  });
}

// ── Simpan Rekap Gaji + Kirim Notifikasi Otomatis ────────────────────────
async function simpanRekap() {
  const errEl = document.getElementById("error-rekap");
  errEl.style.display = "none";

  const tgl_transfer  = document.getElementById("tgl-transfer").value;
  const tabAktif      = document.getElementById("panel-foto").classList.contains("show") ? "foto" : "url";
  let   screenshot_path = "";

  const btn = document.getElementById("btn-simpan-rekap");
  btn.disabled  = true;
  btn.innerHTML = `<span class="spin-sm"></span> Memproses...`;

  // ── STEP 1: Upload foto jika ada ─────────────────────────────────────
  if (tabAktif === "foto" && fotoFile && !fotoUploadedUrl) {
    btn.innerHTML = `<span class="spin-sm"></span> Mengupload foto...`;
    try {
      fotoUploadedUrl = await uploadFoto(fotoFile);
      screenshot_path = fotoUploadedUrl;
    } catch (err) {
      // Tampilkan error upload
      const st = document.getElementById("upload-status");
      document.getElementById("upload-status-icon").innerHTML = `<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>`;
      document.getElementById("upload-status-text").textContent = `Upload gagal: ${err.message}`;
      st.className = "upload-status error show";

      btn.disabled  = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> Simpan & Tandai Dibayar`;
      errEl.textContent   = `Gagal upload foto: ${err.message}`;
      errEl.style.display = "block";
      return;
    }
  } else if (tabAktif === "foto" && fotoUploadedUrl) {
    screenshot_path = fotoUploadedUrl; // sudah diupload sebelumnya
  } else {
    screenshot_path = (document.getElementById("screenshot-url")?.value || "").trim();
  }

  // ── STEP 2: Simpan rekap gaji ─────────────────────────────────────────
  btn.innerHTML = `<span class="spin-sm"></span> Menyimpan rekap...`;

  const potongan = [];
  document.querySelectorAll(".pot-row").forEach(row => {
    const nominal = parseFloat(row.querySelector(".pot-nominal").value) || 0;
    if (nominal > 0) {
      potongan.push({
        jenis_potongan_id: parseInt(row.querySelector(".pot-jenis").value),
        keterangan:        row.querySelector(".pot-ket").value.trim() || null,
        nominal,
      });
    }
  });

  const totalPotongan = potongan.reduce((s, p) => s + p.nominal, 0);
  const gajiBersih    = Math.max(0, totalGajiAktif - totalPotongan);

  const resRekap = await apiFetch("/admin-pusat/rekap-gaji", {
    method: "POST",
    body: JSON.stringify({
      laporan_wo_id:   laporanAktif,
      potongan,
      tgl_transfer:    tgl_transfer    || null,
      screenshot_path: screenshot_path || null,
    }),
  });

  if (!resRekap?.success) {
    btn.disabled  = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> Simpan & Tandai Dibayar`;
    errEl.textContent   = resRekap?.message || "Gagal menyimpan rekap gaji";
    errEl.style.display = "block";
    return;
  }

  // ── STEP 3: Kirim notifikasi otomatis ke admin cabang ─────────────────
  btn.innerHTML = `<span class="spin-sm"></span> Mengirim notifikasi...`;

  const laporan       = rekapDataAktif?.laporan || {};
  const rekap_gaji_id = resRekap?.data?.rekap_gaji_id || null;

  const resNotif = await apiFetch("/admin-pusat/notifikasi/kirim", {
    method: "POST",
    body: JSON.stringify({
      laporan_wo_id:   laporanAktif,
      rekap_gaji_id,
      cabang_id:       laporan.cabang_id,
      nama_teknisi:    laporan.nama_teknisi,
      periode:         `${BLN[laporan.bulan]} ${laporan.tahun}`,
      total_gaji:      totalGajiAktif,
      total_potongan:  totalPotongan,
      gaji_bersih:     gajiBersih,
      tgl_transfer:    tgl_transfer    || null,
      screenshot_path: screenshot_path || null,
    }),
  });

  btn.disabled  = false;
  btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> Simpan & Tandai Dibayar`;

  if (resNotif?.success) {
    showToast(
      "Rekap disimpan & notifikasi terkirim ✓",
      "success",
      `Admin cabang ${escHtml(laporan.nama_cabang || "")} telah diberitahu`
    );
  } else {
    // Rekap tetap tersimpan, notifikasi gagal → info
    showToast(
      "Rekap berhasil disimpan",
      "info",
      `Notifikasi tidak terkirim: ${resNotif?.message || "coba kirim ulang dari menu Kirim Notifikasi"}`
    );
  }

  tutupPanel();
  await loadLaporan();
  await loadBadgeNotifikasi(); // refresh badge notifikasi di sidebar
}

// ── Tutup panel ───────────────────────────────────────────────────────────
function tutupPanel() {
  document.getElementById("detail-overlay").classList.remove("show");
  document.body.style.overflow = "";
  fotoFile        = null;
  fotoUploadedUrl = null;
  laporanAktif    = null;
  rekapDataAktif  = null;
}

function onOverlayClick(e) {
  if (e.target === document.getElementById("detail-overlay")) tutupPanel();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") tutupPanel();
});

// ── Init ──────────────────────────────────────────────────────────────────
document.getElementById("filter-status").value = "terkirim";

Promise.all([
  loadCabang(),
  loadJenisPotongan(),
  loadBadgeNotifikasi(),
]).then(() => loadLaporan());
</script>
