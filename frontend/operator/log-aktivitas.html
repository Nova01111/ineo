<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Aktivitas — Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6fa; --white: #ffffff; --navy: #0f1f38;
      --blue: #185FA5; --blue-lt: #eff6ff; --blue-acc: #3b9eff;
      --text: #1e293b; --text-2: #64748b; --text-3: #94a3b8;
      --border: #e2e8f0; --border-2: #f1f5f9;
      --green: #16a34a; --green-lt: #f0fdf4;
      --amber: #b45309; --amber-lt: #fffbeb;
      --red: #dc2626; --red-lt: #fef2f2;
      --purple: #7c3aed; --purple-lt: #f5f3ff;
      --sidebar-w: 232px; --topbar-h: 56px; --radius: 10px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* ═══════ SIDEBAR ═══════ */
    .sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
    .sidebar-logo { padding: 1.375rem 1.375rem 1.125rem; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-icon svg { width: 17px; height: 17px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-text h2 { font-size: 13.5px; font-weight: 600; color: #fff; }
    .logo-text p  { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .nav-section  { padding: 1.125rem 0 .375rem; overflow-y: auto; flex: 1; }
    .nav-label { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,0.25); padding: 0 1.375rem; margin-bottom: .375rem; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 1.375rem; font-size: 13px; color: rgba(255,255,255,0.5); text-decoration: none; border-left: 2px solid transparent; transition: background .15s, color .15s; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85); }
    .nav-item.active { color: #fff; background: rgba(59,158,255,0.12); border-left-color: var(--blue-acc); font-weight: 500; }
    .nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active .nav-icon { opacity: 1; }
    .user-box { padding: 1rem 1.375rem; border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: white; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 500; color: #fff; }
    .user-role { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 1px; }
    .btn-logout { margin-top: 4px; font-size: 11px; color: rgba(255,100,100,0.7); cursor: pointer; background: none; border: none; padding: 0; font-family: 'DM Sans', sans-serif; transition: color .15s; }
    .btn-logout:hover { color: #f87171; }

    /* ═══════ MAIN ═══════ */
    .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--white); border-bottom: 1px solid var(--border); height: var(--topbar-h); padding: 0 1.75rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .topbar-title { font-size: 15px; font-weight: 600; }

    /* ═══════ CONTENT ═══════ */
    .content { padding: 1.75rem; flex: 1; }

    /* ── Filter bar ── */
    .filter-bar { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: .875rem 1.25rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 1.25rem; animation: fadeUp .3s ease both; }
    .filter-bar label { font-size: 11.5px; font-weight: 500; color: var(--text-2); }
    .filter-bar select, .filter-bar input[type="date"], .filter-bar input[type="text"] {
      font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 10px; outline: none; transition: border-color .15s;
    }
    .filter-bar select:focus, .filter-bar input:focus { border-color: var(--blue-acc); }
    .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
    .ml-auto { margin-left: auto; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); color: var(--text); cursor: pointer; transition: background .15s; white-space: nowrap; }
    .btn:hover { background: var(--bg); }
    .btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn-primary { background: var(--blue); color: white; border-color: var(--blue); }
    .btn-primary:hover { background: #0f4d8a; }
    .btn-sm { font-size: 11.5px; padding: 5px 11px; }

    /* ── Card ── */
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; animation: fadeUp .35s .05s ease both; }
    .card-hdr { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-2); flex-wrap: wrap; gap: 8px; }
    .card-title { font-size: 13.5px; font-weight: 600; }
    .card-count { font-size: 12px; color: var(--text-3); font-family: 'DM Mono', monospace; }
    .card-limit-note { font-size: 11.5px; color: var(--text-3); }

    /* ── Timeline log ── */
    .log-list { padding: .75rem 0; }
    .log-date-group { padding: .5rem 1.25rem .375rem; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); background: var(--bg); border-bottom: 1px solid var(--border-2); border-top: 1px solid var(--border-2); }
    .log-date-group:first-child { border-top: none; }

    .log-item { display: flex; align-items: flex-start; gap: 12px; padding: .875rem 1.25rem; border-bottom: 1px solid var(--border-2); transition: background .1s; }
    .log-item:last-child { border-bottom: none; }
    .log-item:hover { background: #f8fafc; }

    /* Role dot */
    .log-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .log-dot svg { width: 14px; height: 14px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .dot-operator    { background: #e8edf5;          } .dot-operator svg    { stroke: var(--navy); }
    .dot-admin-pusat { background: var(--purple-lt); } .dot-admin-pusat svg { stroke: var(--purple); }
    .dot-admin-cabang{ background: var(--blue-lt);   } .dot-admin-cabang svg{ stroke: var(--blue); }
    .dot-teknisi     { background: var(--green-lt);  } .dot-teknisi svg     { stroke: var(--green); }

    .log-body { flex: 1; min-width: 0; }
    .log-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
    .log-user  { font-size: 13px; font-weight: 600; color: var(--text); }
    .log-aksi  { font-size: 12.5px; color: var(--text-2); }
    .log-ket   { font-size: 12px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
    .log-time  { font-size: 11px; color: var(--text-3); font-family: 'DM Mono', monospace; white-space: nowrap; flex-shrink: 0; margin-top: 3px; }

    /* Role badge inline */
    .role-tag { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .rt-operator     { background: #e8edf5;          color: var(--navy); }
    .rt-admin-pusat  { background: var(--purple-lt); color: var(--purple); }
    .rt-admin-cabang { background: var(--blue-lt);   color: var(--blue); }
    .rt-teknisi      { background: var(--green-lt);  color: var(--green); }

    /* ── State ── */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3.5rem 1rem; gap: 10px; text-align: center; }
    .state-box svg { width: 38px; height: 38px; stroke: var(--text-3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .state-title { font-size: 14px; font-weight: 600; color: var(--text-2); }
    .state-sub   { font-size: 13px; color: var(--text-3); }
    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 3.5rem; }
    .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--navy); color: white; padding: 10px 16px; border-radius: 9px; font-size: 13px; display: none; z-index: 999; max-width: 320px; animation: fadeUp .25s ease; }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- ═══════ SIDEBAR ═══════ -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
    </div>
    <div class="logo-text"><h2>Rekap Gaji</h2><p>Operator</p></div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Menu Utama</div>
    <a class="nav-item" href="/operator/dashboard.html">
      <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>

    </a>
    <div class="nav-label" style="margin-top:.75rem">Master Data</div>
    <a class="nav-item" href="/operator/teknisi.html">

      Teknisi
    </a>
    <a class="nav-item" href="/operator/pengguna.html">

    </a>

    </a>

    </a>
    <a class="nav-item" href="/operator/potongan.html">

    </a>
    <div class="nav-label" style="margin-top:.75rem">Monitor</div>
    <a class="nav-item" href="/operator/monitor-laporan.html">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Monitor Laporan
    </a>
    <a class="nav-item" href="/operator/monitor-gaji.html">
      <svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>

    </a>
    <a class="nav-item active" href="/operator/log-aktivitas.html">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="9" x2="10" y2="9"/></svg>
      Log Aktivitas
    </a>
  </div>
  <div class="user-box">
    <div class="avatar" id="user-avatar">?</div>
    <div>
      <div class="user-name" id="user-nama">-</div>

</div>

<!-- ═══════ MAIN ═══════ -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Log Aktivitas</span>
    <span style="font-size:12px;color:var(--text-3)">Maks. 200 entri terbaru</span>
  </div>

  <div class="content">

    <!-- Filter -->
    <div class="filter-bar">
      <label>Role</label>
      <select id="f-role">
        <option value="">Semua Role</option>
        <option value="operator">Operator</option>
        <option value="admin_pusat">Admin Pusat</option>
        <option value="admin_cabang">Admin Cabang</option>
        <option value="teknisi">Teknisi</option>
      </select>
      <div class="filter-sep"></div>
      <label>Kata kunci</label>
      <input type="text" id="f-aksi" placeholder="Cari aksi..." style="width:160px">
      <div class="filter-sep"></div>
      <label>Dari</label>
      <input type="date" id="f-dari">
      <label>Sampai</label>
      <input type="date" id="f-sampai">
      <button class="btn btn-primary btn-sm" onclick="loadLog()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Tampilkan
      </button>
      <button class="btn btn-sm ml-auto" onclick="resetFilter()">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.49"/></svg>
        Reset
      </button>
    </div>

    <!-- Card Log -->
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Riwayat Aktivitas</span>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="card-limit-note">Diurutkan dari terbaru</span>
          <span class="card-count" id="jumlah-log">—</span>
        </div>
      </div>
      <div id="log-container">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/shared/auth.js"></script>
<script>
  if (!requireAuth("operator")) throw new Error("Unauthorized");
  initUserInfo();

  // ── Default filter: 7 hari terakhir ──────────────────────────────────
  (function initFilter() {
    const today = new Date();
    const week  = new Date(today);
    week.setDate(today.getDate() - 7);
    document.getElementById("f-sampai").value = today.toISOString().split("T")[0];
    document.getElementById("f-dari").value   = week.toISOString().split("T")[0];
  })();

  function resetFilter() {
    document.getElementById("f-role").value   = "";
    document.getElementById("f-aksi").value   = "";
    const today = new Date();
    const week  = new Date(today);
    week.setDate(today.getDate() - 7);
    document.getElementById("f-sampai").value = today.toISOString().split("T")[0];
    document.getElementById("f-dari").value   = week.toISOString().split("T")[0];
    loadLog();
  }

  // ── Load log ──────────────────────────────────────────────────────────
  async function loadLog() {
    document.getElementById("log-container").innerHTML =
      '<div class="spinner-wrap"><div class="spinner"></div></div>';
    document.getElementById("jumlah-log").textContent = "—";

    const qs = new URLSearchParams();
    const role   = document.getElementById("f-role").value;
    const aksi   = document.getElementById("f-aksi").value.trim();
    const dari   = document.getElementById("f-dari").value;
    const sampai = document.getElementById("f-sampai").value;

    if (role)   qs.set("role",   role);
    if (aksi)   qs.set("aksi",   aksi);
    if (dari)   qs.set("dari",   dari);
    if (sampai) qs.set("sampai", sampai);

    const data = await apiFetch(`/operator/log${qs.toString() ? "?" + qs : ""}`);

    if (!data?.success) {
      renderError("Tidak dapat terhubung ke server.");
      return;
    }

    renderLog(data.data);
  }

  // ── Render log sebagai timeline ───────────────────────────────────────
  function renderLog(rows) {
    document.getElementById("jumlah-log").textContent = `${rows.length} entri`;
    const cont = document.getElementById("log-container");

    if (rows.length === 0) {
      cont.innerHTML = `
        <div class="state-box">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/></svg>
          <div class="state-title">Tidak ada log</div>
          <div class="state-sub">Tidak ada aktivitas yang sesuai dengan filter yang dipilih.</div>
        </div>`;
      return;
    }

    // Kelompokkan per tanggal
    const grouped = {};
    rows.forEach(r => {
      const tgl = new Date(r.created_at).toLocaleDateString("id-ID", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });
      if (!grouped[tgl]) grouped[tgl] = [];
      grouped[tgl].push(r);
    });

    let html = '<div class="log-list">';

    Object.entries(grouped).forEach(([tgl, items]) => {
      html += `<div class="log-date-group">${tgl}</div>`;
      items.forEach(r => {
        const roleKey  = (r.role || "").replace(/_/g, "-");
        const dotClass = `dot-${roleKey}`;
        const tagClass = `rt-${roleKey}`;
        const roleLabel = {
          operator:     "Operator",
          admin_pusat:  "Admin Pusat",
          admin_cabang: "Admin Cabang",
          teknisi:      "Teknisi",
        }[r.role] || r.role;

        const waktu = new Date(r.created_at).toLocaleTimeString("id-ID", {
          hour: "2-digit", minute: "2-digit", second: "2-digit"
        });

        html += `
          <div class="log-item">
            <div class="log-dot ${dotClass}">
              ${roleIcon(r.role)}
            </div>
            <div class="log-body">
              <div class="log-header">
                <span class="log-user">${escHtml(r.nama_user)}</span>
                <span class="role-tag ${tagClass}">${escHtml(roleLabel)}</span>
                <span class="log-aksi">${escHtml(r.aksi)}</span>
              </div>
              ${r.keterangan ? `<div class="log-ket">${escHtml(r.keterangan)}</div>` : ""}
            </div>
            <div class="log-time">${waktu}</div>
          </div>`;
      });
    });

    html += '</div>';
    cont.innerHTML = html;
  }

  // ── Icon SVG per role ─────────────────────────────────────────────────
  function roleIcon(role) {
    const icons = {
      operator:     `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,
      admin_pusat:  `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`,
      admin_cabang: `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
      teknisi:      `<svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
    };
    return icons[role] || `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`;
  }

  function renderError(msg) {
    document.getElementById("log-container").innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="state-title">Gagal memuat data</div>
        <div class="state-sub">${escHtml(msg)}</div>
        <button class="btn btn-sm" onclick="loadLog()" style="margin-top:6px">Coba Lagi</button>
      </div>`;
  }

  function escHtml(str) {
    return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Enter untuk submit filter ─────────────────────────────────────────
  document.getElementById("f-aksi").addEventListener("keydown", e => {
    if (e.key === "Enter") loadLog();
  });

  loadLog();
</script>
</body>
</html>
