<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pengguna — Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f4f6fa;
      --white:     #ffffff;
      --navy:      #0f1f38;
      --blue:      #185FA5;
      --blue-lt:   #eff6ff;
      --blue-acc:  #3b9eff;
      --text:      #1e293b;
      --text-2:    #64748b;
      --text-3:    #94a3b8;
      --border:    #e2e8f0;
      --border-2:  #f1f5f9;
      --green:     #16a34a;
      --green-lt:  #f0fdf4;
      --green-bdr: #bbf7d0;
      --amber:     #b45309;
      --amber-lt:  #fffbeb;
      --red:       #dc2626;
      --red-lt:    #fef2f2;
      --red-bdr:   #fecaca;
      --purple:    #7c3aed;
      --purple-lt: #f5f3ff;
      --purple-bdr:#ddd6fe;
      --sidebar-w: 232px;
      --topbar-h:  56px;
      --radius:    10px;
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* ═══════ SIDEBAR ═══════ */
    .sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
    .sidebar-logo { padding: 1.375rem 1.375rem 1.125rem; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-icon svg { width: 17px; height: 17px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-text h2 { font-size: 13.5px; font-weight: 600; color: #fff; }
    .logo-text p  { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .nav-section  { padding: 1.125rem 0 .375rem; overflow-y: auto; flex: 1; }
    .nav-label { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,0.25); padding: 0 1.375rem; margin-bottom: .375rem; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 1.375rem; font-size: 13px; color: rgba(255,255,255,0.5); text-decoration: none; border-left: 2px solid transparent; transition: background .15s, color .15s; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85); }
    .nav-item.active { color: #fff; background: rgba(59,158,255,0.12); border-left-color: var(--blue-acc); font-weight: 500; }
    .nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active .nav-icon { opacity: 1; }
    .user-box { padding: 1rem 1.375rem; border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: white; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 500; color: #fff; }
    .user-role { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 1px; }
    .btn-logout { margin-top: 4px; font-size: 11px; color: rgba(255,100,100,0.7); cursor: pointer; background: none; border: none; padding: 0; font-family: 'DM Sans', sans-serif; transition: color .15s; }
    .btn-logout:hover { color: #f87171; }

    /* ═══════ MAIN ═══════ */
    .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--white); border-bottom: 1px solid var(--border); height: var(--topbar-h); padding: 0 1.75rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }

    /* ═══════ CONTENT ═══════ */
    .content { padding: 1.75rem; flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: 1.25rem; align-items: start; }

    /* ── Filter bar ── */
    .filter-bar { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: .875rem 1.25rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 1.25rem; animation: fadeUp .3s ease both; }
    .filter-bar label { font-size: 11.5px; font-weight: 500; color: var(--text-2); }
    .filter-bar select, .filter-bar input { font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; outline: none; transition: border-color .15s; }
    .filter-bar select:focus, .filter-bar input:focus { border-color: var(--blue-acc); }
    .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
    .ml-auto { margin-left: auto; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); color: var(--text); cursor: pointer; text-decoration: none; transition: background .15s; white-space: nowrap; }
    .btn:hover { background: var(--bg); }
    .btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn-primary { background: var(--blue); color: white; border-color: var(--blue); }
    .btn-primary:hover { background: #0f4d8a; }
    .btn-success { background: var(--green); color: white; border-color: var(--green); }
    .btn-success:hover { background: #15803d; }
    .btn-danger  { color: var(--red); border-color: var(--red-bdr); }
    .btn-danger:hover { background: var(--red-lt); }
    .btn-sm { font-size: 11.5px; padding: 5px 11px; }

    /* ── Card ── */
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; animation: fadeUp .35s .05s ease both; }
    .card-hdr { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-2); }
    .card-title { font-size: 13.5px; font-weight: 600; }
    .card-count { font-size: 12px; color: var(--text-3); font-family: 'DM Mono', monospace; }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th { text-align: left; padding: 9px 14px; font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-2); color: var(--text); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; cursor: pointer; }
    tbody tr:hover td { background: #f8fafc; }
    tbody tr.selected td { background: var(--blue-lt); }
    .td-mono { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-2); }
    .td-bold { font-weight: 500; }

    /* ── Badge ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; }
    .b-active        { background: var(--green-lt);  color: var(--green); }
    .b-inactive      { background: var(--border-2);  color: var(--text-3); }
    .b-admin-cabang  { background: var(--blue-lt);   color: var(--blue); }
    .b-admin-pusat   { background: var(--purple-lt); color: var(--purple); }

    /* ── State ── */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3.5rem 1rem; gap: 10px; text-align: center; }
    .state-box svg { width: 38px; height: 38px; stroke: var(--text-3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .state-title { font-size: 14px; font-weight: 600; color: var(--text-2); }
    .state-sub   { font-size: 13px; color: var(--text-3); }
    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 3.5rem; }
    .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }

    /* ═══════ PANEL DETAIL ═══════ */
    .panel-detail { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); position: sticky; top: calc(var(--topbar-h) + 1.75rem); animation: fadeUp .3s ease both; display: none; }
    .panel-detail.show { display: block; }
    .pd-hdr { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-2); display: flex; align-items: center; justify-content: space-between; }
    .pd-hdr-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .pd-close { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .pd-close:hover { background: var(--bg); }
    .pd-close svg { width: 13px; height: 13px; stroke: var(--text-2); fill: none; stroke-width: 2; stroke-linecap: round; }
    .pd-body { padding: 1.25rem; }
    .pd-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
    .pd-avatar { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: white; }
    .pd-avatar.blue   { background: linear-gradient(135deg, var(--blue), var(--blue-acc)); }
    .pd-avatar.purple { background: linear-gradient(135deg, var(--purple), #a78bfa); }
    .pd-nama  { font-size: 15px; font-weight: 600; color: var(--text); }
    .pd-email { font-size: 12px; color: var(--text-3); margin-top: 2px; font-family: 'DM Mono', monospace; }
    .pd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem 1rem; margin-bottom: 1.25rem; }
    .pd-item label { font-size: 10.5px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 3px; }
    .pd-item span  { font-size: 13px; color: var(--text); font-weight: 500; }
    .pd-item.full  { grid-column: 1 / -1; }
    .pd-actions { display: flex; flex-direction: column; gap: 8px; padding-top: 1rem; border-top: 1px solid var(--border-2); }

    /* ── Modal Tambah/Edit ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,31,56,0.55); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal { background: var(--white); border-radius: 14px; width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto; transform: translateY(20px); transition: transform .25s cubic-bezier(.16,1,.3,1); box-shadow: 0 24px 64px rgba(15,31,56,0.2); }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-2); position: sticky; top: 0; background: var(--white); z-index: 1; }
    .modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .modal-close { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .modal-close:hover { background: var(--bg); }
    .modal-close svg { width: 14px; height: 14px; stroke: var(--text-2); fill: none; stroke-width: 2; stroke-linecap: round; }
    .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .modal-ftr  { padding: 1rem 1.5rem; border-top: 1px solid var(--border-2); display: flex; justify-content: flex-end; gap: 8px; }

    /* Form fields */
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; font-weight: 500; color: var(--text-2); }
    .form-group input, .form-group select { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; outline: none; transition: border-color .15s; width: 100%; }
    .form-group input:focus, .form-group select:focus { border-color: var(--blue-acc); }
    .form-group input.error, .form-group select.error { border-color: var(--red); }
    .form-hint { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* ── Confirm ── */
    .confirm-overlay { position: fixed; inset: 0; background: rgba(15,31,56,0.55); backdrop-filter: blur(4px); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .confirm-overlay.show { opacity: 1; pointer-events: all; }
    .confirm-box { background: var(--white); border-radius: 14px; padding: 1.75rem; width: 100%; max-width: 380px; transform: scale(.95); transition: transform .2s cubic-bezier(.16,1,.3,1); box-shadow: 0 24px 64px rgba(15,31,56,0.2); }
    .confirm-overlay.show .confirm-box { transform: scale(1); }
    .confirm-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
    .confirm-icon svg { width: 20px; height: 20px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .confirm-icon.red   { background: var(--red-lt);   } .confirm-icon.red svg   { stroke: var(--red); }
    .confirm-icon.amber { background: var(--amber-lt); } .confirm-icon.amber svg { stroke: var(--amber); }
    .confirm-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .confirm-desc  { font-size: 13px; color: var(--text-2); line-height: 1.6; margin-bottom: 1.25rem; }
    .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--navy); color: white; padding: 10px 16px; border-radius: 9px; font-size: 13px; display: none; z-index: 999; max-width: 320px; animation: fadeUp .25s ease; }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<!-- ═══════ MAIN ═══════ -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Manajemen Pengguna</span>
    <button class="btn btn-primary btn-sm" onclick="bukaModalTambah()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Tambah Pengguna
    </button>
  </div>

  <div class="content">

    <!-- Kolom Kiri -->
    <div>
      <!-- Filter -->
      <div class="filter-bar">
        <label>Role</label>
        <select id="f-role">
          <option value="">Semua Role</option>
          <option value="admin_cabang">Admin Cabang</option>
          <option value="admin_pusat">Admin Pusat</option>
        </select>
        <div class="filter-sep"></div>
        <label>Status</label>
        <select id="f-status">
          <option value="">Semua</option>
          <option value="1">Aktif</option>
          <option value="0">Nonaktif</option>
        </select>
        <div class="filter-sep"></div>
        <input type="text" id="f-search" placeholder="Cari nama..." style="width:160px">
        <button class="btn btn-sm" onclick="loadPengguna()">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Cari
        </button>
        <button class="btn btn-sm ml-auto" onclick="resetFilter()">
          <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.49"/></svg>
          Reset
        </button>
      </div>

      <!-- Tabel -->
      <div class="card">
        <div class="card-hdr">
          <span class="card-title">Daftar Pengguna</span>
          <span class="card-count" id="jumlah-pengguna">—</span>
        </div>
        <div id="tbl-pengguna">
          <div class="spinner-wrap"><div class="spinner"></div></div>
        </div>
      </div>
    </div>

    <!-- Panel Detail -->
    <div class="panel-detail" id="panel-detail">
      <div class="pd-hdr">
        <span class="pd-hdr-title">Detail Pengguna</span>
        <button class="pd-close" onclick="tutupPanel()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pd-body" id="pd-body"></div>
    </div>

  </div>
</div>

<!-- ═══════ MODAL TAMBAH / EDIT ═══════ -->
<div class="modal-overlay" id="modal-overlay" onclick="tutupModalOuter(event)">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modal-title">Tambah Pengguna</span>
      <button class="modal-close" onclick="tutupModal()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">

      <div class="form-row">
        <div class="form-group">
          <label>Nama Lengkap <span style="color:var(--red)">*</span></label>
          <input type="text" id="f-nama" placeholder="Masukkan nama">
        </div>
        <div class="form-group">
          <label>Role <span style="color:var(--red)">*</span></label>
          <select id="f-role-modal" onchange="onRoleChange()">
            <option value="">Pilih role...</option>
            <option value="admin_cabang">Admin Cabang</option>
            <option value="admin_pusat">Admin Pusat</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Email <span style="color:var(--red)">*</span></label>
        <input type="email" id="f-email" placeholder="contoh@email.com">
      </div>

      <div class="form-group" id="group-cabang" style="display:none">
        <label>Cabang <span style="color:var(--red)">*</span></label>
        <select id="f-cabang-modal">
          <option value="">Pilih cabang...</option>
        </select>
      </div>

      <div class="form-group">
        <label>No. HP</label>
        <input type="text" id="f-nohp" placeholder="08xxxxxxxxxx">
      </div>

      <div class="form-group">
        <label id="label-password">Password <span style="color:var(--red)">*</span></label>
        <input type="password" id="f-password" placeholder="Minimal 6 karakter">
        <span class="form-hint" id="hint-password">Kosongkan jika tidak ingin mengubah password</span>
      </div>
    </div>
    <div class="modal-ftr">
      <button class="btn btn-sm" onclick="tutupModal()">Batal</button>
      <button class="btn btn-primary btn-sm" id="btn-simpan" onclick="simpanPengguna()">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Simpan
      </button>
    </div>
  </div>
</div>

<!-- Konfirmasi toggle -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon amber" id="confirm-icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <div class="confirm-title" id="confirm-title">Konfirmasi</div>
    <div class="confirm-desc"  id="confirm-desc">—</div>
    <div class="confirm-actions">
      <button class="btn btn-sm" onclick="tutupConfirm()">Batal</button>
      <button class="btn btn-sm" id="btn-confirm-ok" onclick="eksekusiToggle()">Ya, Lanjutkan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/shared/auth.js"></script>
<script>
  if (!requireAuth("operator")) throw new Error("Unauthorized");
  initUserInfo();

  let semuaPengguna  = [];
  let cabangList     = [];
  let selectedId     = null;
  let toggleTargetId = null;
  let modeEdit       = false;

  // ── Load cabang untuk dropdown ────────────────────────────────────────
  async function loadCabangDropdown() {
    const data = await apiFetch("/operator/master/cabang");
    if (!data?.success) return;
    cabangList = data.data;
    const sel = document.getElementById("f-cabang-modal");
    sel.innerHTML = '<option value="">Pilih cabang...</option>' +
      cabangList.map(c => `<option value="${c.id}">${escHtml(c.nama_cabang)}</option>`).join("");
  }

  function onRoleChange() {
    const role = document.getElementById("f-role-modal").value;
    document.getElementById("group-cabang").style.display =
      role === "admin_cabang" ? "flex" : "none";
  }

  // ── Reset filter ──────────────────────────────────────────────────────
  function resetFilter() {
    document.getElementById("f-role").value   = "";
    document.getElementById("f-status").value = "";
    document.getElementById("f-search").value = "";
    loadPengguna();
  }

  // ── Load pengguna ─────────────────────────────────────────────────────
  async function loadPengguna() {
    document.getElementById("tbl-pengguna").innerHTML =
      '<div class="spinner-wrap"><div class="spinner"></div></div>';
    document.getElementById("jumlah-pengguna").textContent = "—";
    tutupPanel();

    const role   = document.getElementById("f-role").value;
    const status = document.getElementById("f-status").value;
    const search = document.getElementById("f-search").value.trim();

    const qs = new URLSearchParams();
    if (role)           qs.set("role",      role);
    if (status !== "")  qs.set("is_active", status);
    if (search)         qs.set("search",    search);

    const data = await apiFetch(`/operator/pengguna${qs.toString() ? "?" + qs : ""}`);

    if (!data?.success) {
      renderError("Tidak dapat terhubung ke server.");
      return;
    }

    semuaPengguna = data.data;
    renderTabel(semuaPengguna);
  }

  // ── Render tabel ──────────────────────────────────────────────────────
  function renderTabel(rows) {
    document.getElementById("jumlah-pengguna").textContent = `${rows.length} pengguna`;
    const cont = document.getElementById("tbl-pengguna");

    if (rows.length === 0) {
      cont.innerHTML = `
        <div class="state-box">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <div class="state-title">Tidak ada pengguna</div>
          <div class="state-sub">Coba ubah filter atau tambahkan pengguna baru.</div>
          <button class="btn btn-primary btn-sm" onclick="bukaModalTambah()" style="margin-top:6px">Tambah Pengguna</button>
        </div>`;
      return;
    }

    let html = `<div class="tbl-wrap"><table>
      <thead><tr>
        <th>Nama</th><th>Email</th><th>Role</th><th>Cabang</th><th>Status</th><th>Terdaftar</th>
      </tr></thead><tbody>`;

    rows.forEach(p => {
      const roleBadge   = p.role === "admin_cabang"
        ? `<span class="badge b-admin-cabang">Admin Cabang</span>`
        : `<span class="badge b-admin-pusat">Admin Pusat</span>`;
      const statusBadge = p.is_active
        ? `<span class="badge b-active">Aktif</span>`
        : `<span class="badge b-inactive">Nonaktif</span>`;
      const sel = selectedId === p.id ? " selected" : "";

      html += `
        <tr class="${sel}" onclick="bukaPanel(${p.id})">
          <td class="td-bold">${escHtml(p.nama)}</td>
          <td class="td-mono">${escHtml(p.email)}</td>
          <td>${roleBadge}</td>
          <td>${escHtml(p.nama_cabang || "—")}</td>
          <td>${statusBadge}</td>
          <td class="td-mono">${tglFormat(p.created_at)}</td>
        </tr>`;
    });

    html += `</tbody></table></div>`;
    cont.innerHTML = html;
  }

  function renderError(msg) {
    document.getElementById("tbl-pengguna").innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="state-title">Gagal memuat data</div>
        <div class="state-sub">${escHtml(msg)}</div>
        <button class="btn btn-sm" onclick="loadPengguna()" style="margin-top:6px">Coba Lagi</button>
      </div>`;
  }

  // ═══════════════════════════════════════════════════════
  // PANEL DETAIL
  // ═══════════════════════════════════════════════════════
  function bukaPanel(id) {
    selectedId = id;
    document.querySelectorAll("tbody tr").forEach(tr => tr.classList.remove("selected"));
    event.currentTarget.classList.add("selected");

    document.getElementById("panel-detail").classList.add("show");

    const p = semuaPengguna.find(x => x.id === id);
    if (!p) return;

    const isAC         = p.role === "admin_cabang";
    const avatarClass  = isAC ? "blue" : "purple";
    const roleBadge    = isAC
      ? `<span class="badge b-admin-cabang">Admin Cabang</span>`
      : `<span class="badge b-admin-pusat">Admin Pusat</span>`;
    const statusBadge  = p.is_active
      ? `<span class="badge b-active">Aktif</span>`
      : `<span class="badge b-inactive">Nonaktif</span>`;

    const toggleLabel = p.is_active ? "Nonaktifkan" : "Aktifkan";
    const toggleClass = p.is_active ? "btn-danger"  : "btn-success";

    document.getElementById("pd-body").innerHTML = `
      <div class="pd-avatar-wrap">
        <div class="pd-avatar ${avatarClass}">${escHtml(p.nama.substring(0,2).toUpperCase())}</div>
        <div>
          <div class="pd-nama">${escHtml(p.nama)}</div>
          <div class="pd-email">${escHtml(p.email)}</div>
        </div>
      </div>

      <div class="pd-grid">
        <div class="pd-item">
          <label>Role</label>
          <span>${roleBadge}</span>
        </div>
        <div class="pd-item">
          <label>Status</label>
          <span>${statusBadge}</span>
        </div>
        <div class="pd-item full">
          <label>Cabang</label>
          <span>${escHtml(p.nama_cabang || "—")}</span>
        </div>
        <div class="pd-item">
          <label>No. HP</label>
          <span>${escHtml(p.no_hp || "—")}</span>
        </div>
        <div class="pd-item">
          <label>Terdaftar</label>
          <span>${tglFormat(p.created_at)}</span>
        </div>
      </div>

      <div class="pd-actions">
        <button class="btn btn-primary btn-sm" onclick="bukaModalEdit(${p.id})">
          <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit Pengguna
        </button>
        <button class="btn ${toggleClass} btn-sm" onclick="konfirmasiToggle(${p.id}, '${escHtml(p.nama)}', ${p.is_active})">
          ${p.is_active
            ? `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`
            : `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`}
          ${toggleLabel} Pengguna
        </button>
      </div>`;
  }

  function tutupPanel() {
    selectedId = null;
    document.getElementById("panel-detail").classList.remove("show");
    document.querySelectorAll("tbody tr").forEach(tr => tr.classList.remove("selected"));
  }

  // ═══════════════════════════════════════════════════════
  // MODAL TAMBAH / EDIT
  // ═══════════════════════════════════════════════════════
  function bukaModalTambah() {
    modeEdit = false;
    document.getElementById("modal-title").textContent = "Tambah Pengguna";
    document.getElementById("edit-id").value           = "";
    document.getElementById("f-nama").value            = "";
    document.getElementById("f-email").value           = "";
    document.getElementById("f-nohp").value            = "";
    document.getElementById("f-password").value        = "";
    document.getElementById("f-role-modal").value      = "";
    document.getElementById("f-cabang-modal").value    = "";
    document.getElementById("group-cabang").style.display = "none";
    document.getElementById("label-password").innerHTML  = `Password <span style="color:var(--red)">*</span>`;
    document.getElementById("hint-password").style.display = "none";
    document.getElementById("f-password").placeholder = "Minimal 6 karakter";

    document.getElementById("modal-overlay").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function bukaModalEdit(id) {
    const p = semuaPengguna.find(x => x.id === id);
    if (!p) return;
    modeEdit = true;

    document.getElementById("modal-title").textContent   = "Edit Pengguna";
    document.getElementById("edit-id").value             = p.id;
    document.getElementById("f-nama").value              = p.nama;
    document.getElementById("f-email").value             = p.email;
    document.getElementById("f-nohp").value              = p.no_hp || "";
    document.getElementById("f-password").value          = "";
    document.getElementById("f-role-modal").value        = p.role;
    document.getElementById("f-cabang-modal").value      = p.cabang_id || "";
    document.getElementById("group-cabang").style.display =
      p.role === "admin_cabang" ? "flex" : "none";
    document.getElementById("label-password").innerHTML  = "Password";
    document.getElementById("hint-password").style.display = "block";
    document.getElementById("f-password").placeholder   = "Kosongkan jika tidak diubah";

    document.getElementById("modal-overlay").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function tutupModal() {
    document.getElementById("modal-overlay").classList.remove("show");
    document.body.style.overflow = "";
  }

  function tutupModalOuter(e) {
    if (e.target === document.getElementById("modal-overlay")) tutupModal();
  }

  async function simpanPengguna() {
    const id       = document.getElementById("edit-id").value;
    const nama     = document.getElementById("f-nama").value.trim();
    const email    = document.getElementById("f-email").value.trim();
    const no_hp    = document.getElementById("f-nohp").value.trim();
    const password = document.getElementById("f-password").value;
    const role     = document.getElementById("f-role-modal").value;
    const cabang_id = document.getElementById("f-cabang-modal").value;

    if (!nama || !email || !role) {
      showToast("Nama, email, dan role wajib diisi", false); return;
    }
    if (!modeEdit && !password) {
      showToast("Password wajib diisi untuk pengguna baru", false); return;
    }
    if (role === "admin_cabang" && !cabang_id) {
      showToast("Cabang wajib dipilih untuk Admin Cabang", false); return;
    }

    const btn = document.getElementById("btn-simpan");
    btn.disabled = true;
    btn.textContent = "Menyimpan...";

    const body = { nama, email, no_hp: no_hp || null, role, cabang_id: cabang_id || null };
    if (password) body.password = password;

    const endpoint = modeEdit ? `/operator/pengguna/${id}` : "/operator/pengguna";
    const method   = modeEdit ? "PUT" : "POST";

    const data = await apiFetch(endpoint, { method, body: JSON.stringify(body) });

    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> Simpan`;

    if (!data?.success) {
      showToast(data?.message || "Gagal menyimpan data", false); return;
    }

    showToast(modeEdit ? "Pengguna berhasil diperbarui" : "Pengguna berhasil ditambahkan");
    tutupModal();
    loadPengguna();
  }

  // ═══════════════════════════════════════════════════════
  // TOGGLE AKTIF / NONAKTIF
  // ═══════════════════════════════════════════════════════
  function konfirmasiToggle(id, nama, isActive) {
    toggleTargetId = id;
    const icon  = document.getElementById("confirm-icon");
    const btnOk = document.getElementById("btn-confirm-ok");

    icon.className = `confirm-icon ${isActive ? "red" : "amber"}`;
    document.getElementById("confirm-title").textContent = isActive ? "Nonaktifkan Pengguna?" : "Aktifkan Pengguna?";
    document.getElementById("confirm-desc").textContent  =
      `Apakah Anda yakin ingin ${isActive ? "menonaktifkan" : "mengaktifkan"} pengguna "${nama}"?` +
      (isActive ? " Pengguna tidak akan bisa login." : " Pengguna dapat login kembali.");
    btnOk.className   = `btn btn-sm ${isActive ? "btn-danger" : "btn-success"}`;
    btnOk.textContent = isActive ? "Ya, Nonaktifkan" : "Ya, Aktifkan";

    document.getElementById("confirm-overlay").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function tutupConfirm() {
    document.getElementById("confirm-overlay").classList.remove("show");
    document.body.style.overflow = "";
    toggleTargetId = null;
  }

  async function eksekusiToggle() {
    if (!toggleTargetId) return;
    const btn = document.getElementById("btn-confirm-ok");
    btn.disabled = true; btn.textContent = "Memproses...";

    const data = await apiFetch(`/operator/pengguna/${toggleTargetId}/toggle`, { method: "PATCH" });

    btn.disabled = false;
    tutupConfirm();

    if (!data?.success) { showToast(data?.message || "Gagal mengubah status", false); return; }
    showToast(data.message);
    loadPengguna();
  }

  // ── ESC ───────────────────────────────────────────────────────────────
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (document.getElementById("confirm-overlay").classList.contains("show")) tutupConfirm();
    else if (document.getElementById("modal-overlay").classList.contains("show")) tutupModal();
    else tutupPanel();
  });

  function escHtml(str) {
    return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Init ──────────────────────────────────────────────────────────────
  Promise.all([loadCabangDropdown(), loadPengguna()]);
</script>
</body>
</html>
