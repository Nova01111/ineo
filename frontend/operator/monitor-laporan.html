<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Laporan — Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6fa; --white: #ffffff; --navy: #0f1f38;
      --blue: #185FA5; --blue-lt: #eff6ff; --blue-acc: #3b9eff;
      --text: #1e293b; --text-2: #64748b; --text-3: #94a3b8;
      --border: #e2e8f0; --border-2: #f1f5f9;
      --green: #16a34a; --green-lt: #f0fdf4;
      --amber: #b45309; --amber-lt: #fffbeb; --amber-bdr: #fde68a;
      --red: #dc2626; --red-lt: #fef2f2;
      --sidebar-w: 232px; --topbar-h: 56px; --radius: 10px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* ═══════ SIDEBAR ═══════ */
    .sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
    .sidebar-logo { padding: 1.375rem 1.375rem 1.125rem; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-icon svg { width: 17px; height: 17px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-text h2 { font-size: 13.5px; font-weight: 600; color: #fff; }
    .logo-text p  { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .nav-section  { padding: 1.125rem 0 .375rem; overflow-y: auto; flex: 1; }
    .nav-label { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,0.25); padding: 0 1.375rem; margin-bottom: .375rem; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 1.375rem; font-size: 13px; color: rgba(255,255,255,0.5); text-decoration: none; border-left: 2px solid transparent; transition: background .15s, color .15s; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85); }
    .nav-item.active { color: #fff; background: rgba(59,158,255,0.12); border-left-color: var(--blue-acc); font-weight: 500; }
    .nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active .nav-icon { opacity: 1; }
    .user-box { padding: 1rem 1.375rem; border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: white; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 500; color: #fff; }
    .user-role { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 1px; }
    .btn-logout { margin-top: 4px; font-size: 11px; color: rgba(255,100,100,0.7); cursor: pointer; background: none; border: none; padding: 0; font-family: 'DM Sans', sans-serif; transition: color .15s; }
    .btn-logout:hover { color: #f87171; }

    /* ═══════ MAIN ═══════ */
    .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--white); border-bottom: 1px solid var(--border); height: var(--topbar-h); padding: 0 1.75rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .topbar-title { font-size: 15px; font-weight: 600; }

    /* ═══════ CONTENT ═══════ */
    .content { padding: 1.75rem; flex: 1; }

    /* ── Stat strip ── */
    .stat-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 1.25rem; animation: fadeUp .3s ease both; }
    .stat-item { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: .875rem 1rem; text-align: center; }
    .stat-val   { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-label { font-size: 10.5px; color: var(--text-3); margin-top: 4px; text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
    .stat-val.blue   { color: var(--blue); }
    .stat-val.amber  { color: var(--amber); }
    .stat-val.green  { color: var(--green); }
    .stat-val.red    { color: var(--red); }
    .stat-val.navy   { color: var(--navy); }

    /* ── Filter bar ── */
    .filter-bar { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: .875rem 1.25rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 1.25rem; animation: fadeUp .3s .05s ease both; }
    .filter-bar label { font-size: 11.5px; font-weight: 500; color: var(--text-2); }
    .filter-bar select, .filter-bar input { font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; outline: none; transition: border-color .15s; }
    .filter-bar select:focus, .filter-bar input:focus { border-color: var(--blue-acc); }
    .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
    .ml-auto { margin-left: auto; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); color: var(--text); cursor: pointer; text-decoration: none; transition: background .15s; white-space: nowrap; }
    .btn:hover { background: var(--bg); }
    .btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn-primary { background: var(--blue); color: white; border-color: var(--blue); }
    .btn-primary:hover { background: #0f4d8a; }
    .btn-sm { font-size: 11.5px; padding: 5px 11px; }

    /* ── Card ── */
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; animation: fadeUp .35s .1s ease both; }
    .card-hdr { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-2); }
    .card-title { font-size: 13.5px; font-weight: 600; }
    .card-count { font-size: 12px; color: var(--text-3); font-family: 'DM Mono', monospace; }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th { text-align: left; padding: 9px 14px; font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-2); color: var(--text); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover td { background: #f8fafc; }
    .td-mono { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-2); }
    .td-bold { font-weight: 500; }
    .td-green { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--green); font-weight: 500; }

    /* ── Badge ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; }
    .b-draft    { background: var(--border-2);  color: var(--text-2); }
    .b-terkirim { background: var(--blue-lt);   color: #1d4ed8; }
    .b-diproses { background: var(--amber-lt);  color: var(--amber); }
    .b-selesai  { background: var(--green-lt);  color: var(--green); }

    /* ── State ── */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3.5rem 1rem; gap: 10px; text-align: center; }
    .state-box svg { width: 38px; height: 38px; stroke: var(--text-3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .state-title { font-size: 14px; font-weight: 600; color: var(--text-2); }
    .state-sub   { font-size: 13px; color: var(--text-3); }
    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 3.5rem; }
    .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--navy); color: white; padding: 10px 16px; border-radius: 9px; font-size: 13px; display: none; z-index: 999; max-width: 320px; animation: fadeUp .25s ease; }

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<!-- ═══════ MAIN ═══════ -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Monitor Laporan WO</span>
    <span style="font-size:12px;color:var(--text-3)">Read-only · Semua cabang</span>
  </div>

  <div class="content">

    <!-- Stat strip -->
    <div class="stat-strip" id="stat-strip">
      <div class="stat-item"><div class="stat-val blue"  id="s-total">—</div><div class="stat-label">Total</div></div>
      <div class="stat-item"><div class="stat-val"       id="s-draft">—</div><div class="stat-label">Draft</div></div>
      <div class="stat-item"><div class="stat-val blue"  id="s-terkirim">—</div><div class="stat-label">Terkirim</div></div>
      <div class="stat-item"><div class="stat-val amber" id="s-diproses">—</div><div class="stat-label">Diproses</div></div>
      <div class="stat-item"><div class="stat-val green" id="s-selesai">—</div><div class="stat-label">Selesai</div></div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <label>Bulan</label>
      <select id="f-bulan">
        <option value="">Semua</option>
        <option value="1">Januari</option><option value="2">Februari</option>
        <option value="3">Maret</option><option value="4">April</option>
        <option value="5">Mei</option><option value="6">Juni</option>
        <option value="7">Juli</option><option value="8">Agustus</option>
        <option value="9">September</option><option value="10">Oktober</option>
        <option value="11">November</option><option value="12">Desember</option>
      </select>
      <label>Tahun</label>
      <select id="f-tahun"></select>
      <div class="filter-sep"></div>
      <label>Cabang</label>
      <select id="f-cabang"><option value="">Semua Cabang</option></select>
      <div class="filter-sep"></div>
      <label>Status</label>
      <select id="f-status">
        <option value="">Semua Status</option>
        <option value="draft">Draft</option>
        <option value="terkirim">Terkirim</option>
        <option value="diproses">Diproses</option>
        <option value="selesai">Selesai</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="loadLaporan()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Tampilkan
      </button>
      <button class="btn btn-sm ml-auto" onclick="resetFilter()">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.49"/></svg>
        Reset
      </button>
    </div>

    <!-- Tabel -->
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Daftar Laporan WO</span>
        <span class="card-count" id="jumlah-laporan">—</span>
      </div>
      <div id="tbl-laporan">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/shared/auth.js"></script>
<script>
  if (!requireAuth("operator")) throw new Error("Unauthorized");
  initUserInfo();

  const STATUS_LABEL = { draft:"Draft", terkirim:"Terkirim", diproses:"Diproses", selesai:"Selesai" };

  // ── Init filter ───────────────────────────────────────────────────────
  (function initFilter() {
    const now = new Date();
    const sel = document.getElementById("f-tahun");
    const thn = now.getFullYear();
    const optAll = document.createElement("option");
    optAll.value = ""; optAll.textContent = "Semua"; sel.appendChild(optAll);
    for (let y = thn; y >= thn - 3; y--) {
      const o = document.createElement("option");
      o.value = y; o.textContent = y; sel.appendChild(o);
    }
    document.getElementById("f-bulan").value = now.getMonth() + 1;
    document.getElementById("f-tahun").value = thn;
  })();

  async function loadCabangFilter() {
    const data = await apiFetch("/operator/master/cabang");
    if (!data?.success) return;
    const sel = document.getElementById("f-cabang");
    data.data.forEach(c => {
      const o = document.createElement("option");
      o.value = c.id; o.textContent = c.nama_cabang; sel.appendChild(o);
    });
  }

  function resetFilter() {
    const now = new Date();
    document.getElementById("f-bulan").value   = now.getMonth() + 1;
    document.getElementById("f-tahun").value   = now.getFullYear();
    document.getElementById("f-cabang").value  = "";
    document.getElementById("f-status").value  = "";
    loadLaporan();
  }

  // ── Load laporan ──────────────────────────────────────────────────────
  async function loadLaporan() {
    document.getElementById("tbl-laporan").innerHTML =
      '<div class="spinner-wrap"><div class="spinner"></div></div>';
    document.getElementById("jumlah-laporan").textContent = "—";

    const qs = new URLSearchParams();
    const bulan   = document.getElementById("f-bulan").value;
    const tahun   = document.getElementById("f-tahun").value;
    const cabang  = document.getElementById("f-cabang").value;
    const status  = document.getElementById("f-status").value;
    if (bulan)  qs.set("bulan",     bulan);
    if (tahun)  qs.set("tahun",     tahun);
    if (cabang) qs.set("cabang_id", cabang);
    if (status) qs.set("status",    status);

    const data = await apiFetch(`/operator/monitor/laporan${qs.toString() ? "?" + qs : ""}`);
    if (!data?.success) { renderError("Tidak dapat terhubung ke server."); return; }

    updateStat(data.data);
    renderTabel(data.data);
  }

  function updateStat(rows) {
    document.getElementById("s-total").textContent    = rows.length;
    document.getElementById("s-draft").textContent    = rows.filter(r => r.status === "draft").length;
    document.getElementById("s-terkirim").textContent = rows.filter(r => r.status === "terkirim").length;
    document.getElementById("s-diproses").textContent = rows.filter(r => r.status === "diproses").length;
    document.getElementById("s-selesai").textContent  = rows.filter(r => r.status === "selesai").length;
  }

  function renderTabel(rows) {
    document.getElementById("jumlah-laporan").textContent = `${rows.length} laporan`;
    const cont = document.getElementById("tbl-laporan");

    if (rows.length === 0) {
      cont.innerHTML = `
        <div class="state-box">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <div class="state-title">Tidak ada laporan</div>
          <div class="state-sub">Tidak ada laporan yang sesuai dengan filter yang dipilih.</div>
        </div>`;
      return;
    }

    let html = `<div class="tbl-wrap"><table>
      <thead><tr>
        <th>ID</th><th>Teknisi</th><th>Cabang</th><th>Provider</th>
        <th>Sub Project</th><th>Tipe</th><th>Periode</th>
        <th>Total Upah</th><th>Admin Pusat</th><th>Status</th>
      </tr></thead><tbody>`;

    rows.forEach(r => {
      const badge = `<span class="badge b-${r.status}">${STATUS_LABEL[r.status] || r.status}</span>`;
      const tipe  = r.tipe_pembayaran === "gaji_tetap"
        ? `<span style="font-size:11px;color:var(--green);font-weight:500">Gaji Tetap</span>`
        : `<span style="font-size:11px;color:var(--blue);font-weight:500">Per WO</span>`;

      html += `<tr>
        <td class="td-mono">#${r.id}</td>
        <td class="td-bold">${escHtml(r.nama_teknisi)}</td>
        <td>${escHtml(r.nama_cabang)}</td>
        <td>${escHtml(r.nama_provider)}</td>
        <td>${escHtml(r.sub_project)}</td>
        <td>${tipe}</td>
        <td class="td-mono">${BULAN[r.bulan]} ${r.tahun}</td>
        <td class="td-green">${rupiah(r.total_upah)}</td>
        <td>${escHtml(r.nama_admin_pusat || "—")}</td>
        <td>${badge}</td>
      </tr>`;
    });

    html += `</tbody></table></div>`;
    cont.innerHTML = html;
  }

  function renderError(msg) {
    document.getElementById("tbl-laporan").innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="state-title">Gagal memuat data</div>
        <div class="state-sub">${escHtml(msg)}</div>
        <button class="btn btn-sm" onclick="loadLaporan()" style="margin-top:6px">Coba Lagi</button>
      </div>`;
  }

  function escHtml(str) {
    return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  Promise.all([loadCabangFilter(), loadLaporan()]);
</script>
</body>
</html>
