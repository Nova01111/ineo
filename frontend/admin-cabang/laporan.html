<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan WO — Admin Cabang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f4f6fa;
      --white:     #ffffff;
      --navy:      #0f1f38;
      --blue:      #185FA5;
      --blue-lt:   #eff6ff;
      --blue-acc:  #3b9eff;
      --text:      #1e293b;
      --text-2:    #64748b;
      --text-3:    #94a3b8;
      --border:    #e2e8f0;
      --border-2:  #f1f5f9;
      --green:     #16a34a;
      --green-lt:  #f0fdf4;
      --green-bdr: #bbf7d0;
      --amber:     #b45309;
      --amber-lt:  #fffbeb;
      --amber-bdr: #fde68a;
      --red:       #dc2626;
      --red-lt:    #fef2f2;
      --red-bdr:   #fecaca;
      --sidebar-w: 232px;
      --topbar-h:  56px;
      --radius:    10px;
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* ═══════ SIDEBAR ═══════ */
    .sidebar { width: var(--sidebar-w); background: var(--navy); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 50; }
    .sidebar-logo { padding: 1.375rem 1.375rem 1.125rem; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-icon svg { width: 17px; height: 17px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-text h2 { font-size: 13.5px; font-weight: 600; color: #fff; }
    .logo-text p  { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .nav-section  { padding: 1.125rem 0 .375rem; }
    .nav-label { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,0.25); padding: 0 1.375rem; margin-bottom: .375rem; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 1.375rem; font-size: 13px; color: rgba(255,255,255,0.5); text-decoration: none; border-left: 2px solid transparent; transition: background .15s, color .15s; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85); }
    .nav-item.active { color: #fff; background: rgba(59,158,255,0.12); border-left-color: var(--blue-acc); font-weight: 500; }
    .nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-badge { margin-left: auto; background: var(--red); color: white; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px; display: none; }
    .nav-badge.show { display: inline-block; }
    .user-box { margin-top: auto; padding: 1rem 1.375rem; border-top: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--blue-acc)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: white; flex-shrink: 0; }
    .user-name { font-size: 13px; font-weight: 500; color: #fff; }
    .user-role { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 1px; }
    .btn-logout { margin-top: 4px; font-size: 11px; color: rgba(255,100,100,0.7); cursor: pointer; background: none; border: none; padding: 0; font-family: 'DM Sans', sans-serif; transition: color .15s; }
    .btn-logout:hover { color: #f87171; }

    /* ═══════ MAIN ═══════ */
    .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--white); border-bottom: 1px solid var(--border); height: var(--topbar-h); padding: 0 1.75rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }

    /* ═══════ CONTENT ═══════ */
    .content { padding: 1.75rem; flex: 1; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'DM Sans', sans-serif; font-size: 12.5px; font-weight: 500;
      padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--white); color: var(--text); cursor: pointer; text-decoration: none;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: var(--bg); }
    .btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn-primary { background: var(--blue); color: white; border-color: var(--blue); }
    .btn-primary:hover { background: #0f4d8a; border-color: #0f4d8a; }
    .btn-danger  { color: var(--red); border-color: var(--red-bdr); background: var(--white); }
    .btn-danger:hover { background: var(--red-lt); }
    .btn-sm { font-size: 11.5px; padding: 5px 11px;}
    .btn-xs { font-size: 11px; padding: 4px 9px}

    /* ── Filter bar ── */
    .filter-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 1.25rem;
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .875rem 1.25rem;
      animation: fadeUp .3s ease both;
    }
    .filter-bar label { font-size: 11.5px; font-weight: 500; color: var(--text-2); margin-right: 4px; }
    .filter-bar select, .filter-bar input {
      font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
      padding: 6px 10px; outline: none; cursor: pointer;
      transition: border-color .15s;
    }
    .filter-bar select:focus, .filter-bar input:focus { border-color: var(--blue-acc); }
    .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .filter-bar .ml-auto { margin-left: auto; }

    /* ── Card tabel ── */
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; animation: fadeUp .35s .05s ease both; }
    .card-hdr { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-2); }
    .card-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .card-count { font-size: 12px; color: var(--text-3); font-family: 'DM Mono', monospace; }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    thead th {
      text-align: left; padding: 9px 14px; font-size: 11px; font-weight: 600;
      color: var(--text-3); letter-spacing: .04em; text-transform: uppercase;
      background: var(--bg); border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: var(--text-2); }
    tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-2); color: var(--text); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; cursor: pointer; }
    tbody tr:hover td { background: #f8fafc; }
    .td-mono { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-2); }
    .td-bold { font-weight: 500; }
    .td-green { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--green); font-weight: 500; }

    /* ── Badge status ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; }
    .b-draft    { background: var(--border-2); color: var(--text-2); }
    .b-terkirim { background: var(--blue-lt);  color: #1d4ed8; }
    .b-diproses { background: var(--amber-lt); color: var(--amber); }
    .b-selesai  { background: var(--green-lt); color: var(--green); }
    .b-dibayar  { background: var(--green-lt); color: var(--green); }

    /* ── Aksi cell ── */
    .aksi-cell { display: flex; align-items: center; gap: 6px; }

    /* ── State: empty / loading / error ── */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3.5rem 1rem; gap: 10px; text-align: center; }
    .state-box svg { width: 38px; height: 38px; stroke: var(--text-3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .state-title { font-size: 14px; font-weight: 600; color: var(--text-2); }
    .state-sub   { font-size: 13px; color: var(--text-3); }
    .spinner-wrap { display: flex; align-items: center; justify-content: center; padding: 3.5rem; }
    .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }

    /* ═══════ MODAL DETAIL ═══════ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,31,56,0.55);
      backdrop-filter: blur(4px); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem; opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--white); border-radius: 14px; width: 100%; max-width: 620px;
      max-height: 88vh; overflow-y: auto;
      transform: translateY(20px); transition: transform .25s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 24px 64px rgba(15,31,56,0.2);
    }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-2);
      position: sticky; top: 0; background: var(--white); z-index: 1;
    }
    .modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .modal-close { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .modal-close:hover { background: var(--bg); }
    .modal-close svg { width: 14px; height: 14px; stroke: var(--text-2); fill: none; stroke-width: 2; stroke-linecap: round; }
    .modal-body { padding: 1.5rem; }

    /* Detail grid */
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .875rem 1.5rem; margin-bottom: 1.25rem; }
    .detail-item label { font-size: 11px; font-weight: 500; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; display: block; margin-bottom: 3px; }
    .detail-item span  { font-size: 13px; color: var(--text); font-weight: 500; }

    /* Tabel detail WO di dalam modal */
    .detail-wo-title { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
    .detail-wo-tbl   { width: 100%; border-collapse: collapse; font-size: 12.5px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .detail-wo-tbl th { background: var(--bg); padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-3); border-bottom: 1px solid var(--border); }
    .detail-wo-tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border-2); color: var(--text); }
    .detail-wo-tbl tr:last-child td { border-bottom: none; }
    .detail-wo-total { display: flex; justify-content: space-between; align-items: center; background: var(--green-lt); border: 1px solid var(--green-bdr); border-radius: 8px; padding: .875rem 1rem; margin-top: .875rem; }
    .detail-wo-total-label { font-size: 12px; color: var(--green); font-weight: 500; }
    .detail-wo-total-val   { font-size: 16px; font-weight: 600; color: var(--green); font-family: 'DM Mono', monospace; }

    /* Modal footer: aksi kirim */
    .modal-ftr { padding: 1rem 1.5rem; border-top: 1px solid var(--border-2); display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
    .modal-ftr select { font-family: 'DM Sans', sans-serif; font-size: 12.5px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; outline: none; flex: 1; max-width: 220px; }
    .modal-ftr select:focus { border-color: var(--blue-acc); }

    /* ═══════ MODAL KONFIRMASI HAPUS ═══════ */
    .confirm-overlay {
      position: fixed; inset: 0; background: rgba(15,31,56,0.55);
      backdrop-filter: blur(4px); z-index: 300;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .confirm-overlay.show { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: var(--white); border-radius: 14px; padding: 1.75rem; width: 100%; max-width: 380px;
      transform: scale(.95); transition: transform .2s cubic-bezier(.16,1,.3,1);
      box-shadow: 0 24px 64px rgba(15,31,56,0.2);
    }
    .confirm-overlay.show .confirm-box { transform: scale(1); }
    .confirm-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--red-lt); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
    .confirm-icon svg { width: 20px; height: 20px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .confirm-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .confirm-desc  { font-size: 13px; color: var(--text-2); line-height: 1.6; margin-bottom: 1.25rem; }
    .confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--navy); color: white; padding: 10px 16px; border-radius: 9px; font-size: 13px; display: none; z-index: 999; max-width: 320px; animation: fadeUp .25s ease; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

    </a>

      Laporan WO
    </a>
    <a class="nav-item" href="input-laporan.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>

    </a>

      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

  <div class="user-box">
    <div class="avatar" id="user-avatar">?</div>

      <div class="user-name" id="user-nama">-</div>
      <div class="user-role">Admin Cabang</div>
      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>
  </div>
</div>

<!-- ═══════ MAIN ═══════ -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title">Laporan WO</span>
    <a href="input-laporan.html" class="btn btn-primary btn-sm">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Buat Laporan
    </a>
  </div>

  <div class="content">

    <!-- Filter bar -->
    <div class="filter-bar">
      <label>Bulan</label>
      <select id="f-bulan">
        <option value="">Semua</option>
        <option value="1">Januari</option><option value="2">Februari</option>
        <option value="3">Maret</option><option value="4">April</option>
        <option value="5">Mei</option><option value="6">Juni</option>
        <option value="7">Juli</option><option value="8">Agustus</option>
        <option value="9">September</option><option value="10">Oktober</option>
        <option value="11">November</option><option value="12">Desember</option>
      </select>

      <label>Tahun</label>
      <select id="f-tahun"></select>

      <div class="filter-sep"></div>

      <label>Status</label>
      <select id="f-status">
        <option value="">Semua Status</option>
        <option value="draft">Draft</option>
        <option value="terkirim">Terkirim</option>
        <option value="diproses">Diproses</option>
        <option value="selesai">Selesai</option>
      </select>

      <button class="btn btn-sm btn-color" onclick="loadLaporan()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Tampilkan
      </button>

      <button class="btn btn-sm ml-auto" onclick="resetFilter()">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.49"/></svg>
        Reset
      </button>
    </div>

    <!-- Tabel laporan -->
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Daftar Laporan WO</span>
        <span class="card-count" id="jumlah-laporan">—</span>
      </div>
      <div id="tbl-laporan">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </div>

  </div>
</div>

<!-- ═══════ MODAL DETAIL ═══════ -->
<div class="modal-overlay" id="modal-overlay" onclick="tutupModal(event)">
  <div class="modal" id="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modal-title">Detail Laporan</span>
      <button class="modal-close" onclick="tutupModal()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
    <!-- Footer kirim — hanya muncul saat laporan draft -->
    <div class="modal-ftr" id="modal-ftr" style="display:none">
      <select id="modal-sel-ap">
        <option value="">Pilih Admin Pusat tujuan...</option>
      </select>
      <button class="btn btn-primary btn-sm" id="btn-modal-kirim" onclick="kirimDariModal()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Kirim
      </button>
    </div>
  </div>
</div>

<!-- ═══════ MODAL KONFIRMASI HAPUS ═══════ -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    </div>
    <div class="confirm-title">Hapus Laporan?</div>
    <div class="confirm-desc" id="confirm-desc">Laporan ini akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.</div>
    <div class="confirm-actions">
      <button class="btn btn-sm" onclick="tutupConfirm()">Batal</button>
      <button class="btn btn-danger btn-sm" id="btn-confirm-hapus" onclick="eksekusiHapus()">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        Ya, Hapus
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ═══════ SCRIPTS ═══════ -->
<script src="../shared/auth.js"></script>
<script>
  if (!requireAuth("admin_cabang")) throw new Error("Unauthorized");
  initUserInfo();

  // ── State ──────────────────────────────────────────────────────────────
  let adminPusatList  = [];   // cache list admin pusat
  let hapusTargetId   = null; // id laporan yang akan dihapus
  let modalLaporanId  = null; // id laporan yang sedang dibuka di modal

  // ── Label status ──────────────────────────────────────────────────────
  const STATUS_LABEL = {
    draft: "Draft", terkirim: "Terkirim",
    diproses: "Diproses", selesai: "Selesai", dibayar: "Dibayar",
  };

  // ── Init filter tahun ──────────────────────────────────────────────────
  (function initFilter() {
    const sel = document.getElementById("f-tahun");
    const now = new Date();
    const thn = now.getFullYear();
    // opsi "Semua"
    const optAll = document.createElement("option");
    optAll.value = ""; optAll.textContent = "Semua"; sel.appendChild(optAll);
    for (let y = thn; y >= thn - 2; y--) {
      const o = document.createElement("option");
      o.value = y; o.textContent = y; sel.appendChild(o);
    }
    // Default: bulan & tahun sekarang
    document.getElementById("f-bulan").value = now.getMonth() + 1;
    document.getElementById("f-tahun").value = thn;
  })();

  // ── Load admin pusat (untuk dropdown kirim) ────────────────────────────
  async function loadAdminPusat() {
    const data = await apiFetch("/admin-cabang/master/admin-pusat");
    if (data?.success) {
      adminPusatList = data.data;
    }
  }

  // ── Reset filter ke default ────────────────────────────────────────────
  function resetFilter() {
    const now = new Date();
    document.getElementById("f-bulan").value  = now.getMonth() + 1;
    document.getElementById("f-tahun").value  = now.getFullYear();
    document.getElementById("f-status").value = "";
    loadLaporan();
  }

  // ── Load daftar laporan dari API ───────────────────────────────────────
  async function loadLaporan() {
    document.getElementById("tbl-laporan").innerHTML =
      '<div class="spinner-wrap"><div class="spinner"></div></div>';
    document.getElementById("jumlah-laporan").textContent = "—";

    const bulan  = document.getElementById("f-bulan").value;
    const tahun  = document.getElementById("f-tahun").value;
    const status = document.getElementById("f-status").value;

    const qs = new URLSearchParams();
    if (bulan)  qs.set("bulan",  bulan);
    if (tahun)  qs.set("tahun",  tahun);
    if (status) qs.set("status", status);

    const data = await apiFetch(`/admin-cabang/laporan${qs.toString() ? "?" + qs : ""}`);

    if (!data) {
      renderTabelError("Tidak dapat terhubung ke server.");
      return;
    }
    if (!data.success) {
      renderTabelError(data.message || "Gagal memuat data.");
      return;
    }

    renderTabel(data.data);
  }

  // ── Render tabel ──────────────────────────────────────────────────────
  function renderTabel(rows) {
    const cont = document.getElementById("tbl-laporan");
    document.getElementById("jumlah-laporan").textContent = `${rows.length} laporan`;

    if (rows.length === 0) {
      cont.innerHTML = `
        <div class="state-box">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <div class="state-title">Belum ada laporan</div>
          <div class="state-sub">Tidak ada laporan yang sesuai filter yang dipilih.</div>
          <a href="input-laporan.html" class="btn btn-primary btn-sm" style="margin-top:6px">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Buat Laporan Baru
          </a>
        </div>`;
      return;
    }

    let html = `
      <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Teknisi</th>
            <th>Provider</th>
            <th>Sub Project</th>
            <th>Tipe</th>
            <th>Periode</th>
            <th>Total Upah</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>`;

    rows.forEach(r => {
      const badge = `<span class="badge b-${r.status}">${STATUS_LABEL[r.status] || r.status}</span>`;
      const tipe  = r.tipe_pembayaran === "gaji_tetap"
        ? `<span style="font-size:11px;color:var(--green);font-weight:500">Gaji Tetap</span>`
        : `<span style="font-size:11px;color:var(--blue);font-weight:500">Per WO</span>`;

      // Tombol aksi — hapus & kirim hanya untuk draft
      let aksi = `<div class="aksi-cell" onclick="event.stopPropagation()">`;
      aksi += `<button class="btn btn-xs" onclick="bukaDetail(${r.id})">Detail</button>`;
      if (r.status === "draft") {
        aksi += `<button class="btn btn-xs btn-primary" onclick="bukaKirim(${r.id}, event)">Kirim</button>`;
        aksi += `<button class="btn btn-xs btn-danger" onclick="konfirmasiHapus(${r.id}, '${escHtml(r.nama_teknisi)}', event)">Hapus</button>`;
      }
      aksi += `</div>`;

      html += `
        <tr onclick="bukaDetail(${r.id})">
          <td class="td-mono">#${r.id}</td>
          <td class="td-bold">${escHtml(r.nama_teknisi)}</td>
          <td>${escHtml(r.nama_provider)}</td>
          <td>${escHtml(r.sub_project)}</td>
          <td>${tipe}</td>
          <td class="td-mono">${BULAN[r.bulan]} ${r.tahun}</td>
          <td class="td-green">${rupiah(r.total_upah)}</td>
          <td>${badge}</td>
          <td>${aksi}</td>
        </tr>`;
    });

    html += `</tbody></table></div>`;
    cont.innerHTML = html;
  }

  function renderTabelError(msg) {
    document.getElementById("tbl-laporan").innerHTML = `
      <div class="state-box">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div class="state-title">Gagal memuat data</div>
        <div class="state-sub">${escHtml(msg)}</div>
        <button class="btn btn-sm" onclick="loadLaporan()" style="margin-top:6px">Coba Lagi</button>
      </div>`;
  }

  // ════════════════════════════════════════════════════════
  // MODAL DETAIL
  // ════════════════════════════════════════════════════════
  async function bukaDetail(id) {
    modalLaporanId = id;
    const overlay = document.getElementById("modal-overlay");
    const body    = document.getElementById("modal-body");
    const ftr     = document.getElementById("modal-ftr");

    // Reset & buka
    body.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
    ftr.style.display = "none";
    document.getElementById("modal-title").textContent = `Detail Laporan #${id}`;
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";

    const data = await apiFetch(`/admin-cabang/laporan/${id}`);

    if (!data?.success) {
      body.innerHTML = `<div class="state-box"><div class="state-title">Gagal memuat detail</div><div class="state-sub">${escHtml(data?.message || "Terjadi kesalahan")}</div></div>`;
      return;
    }

    const lp = data.data.laporan;
    const dt = data.data.detail;

    // ── Render info laporan ──
    let html = `
      <div class="detail-grid">
        <div class="detail-item"><label>Teknisi</label><span>${escHtml(lp.nama_teknisi)}</span></div>
        <div class="detail-item"><label>Cabang</label><span>${escHtml(lp.nama_cabang)}</span></div>
        <div class="detail-item"><label>Provider</label><span>${escHtml(lp.nama_provider)}</span></div>
        <div class="detail-item"><label>Project</label><span>${escHtml(lp.nama_project)}</span></div>
        <div class="detail-item"><label>Sub Project</label><span>${escHtml(lp.sub_project)}</span></div>
        <div class="detail-item"><label>Tipe Pembayaran</label>
          <span style="color:${lp.tipe_pembayaran === 'gaji_tetap' ? 'var(--green)' : 'var(--blue)'}">
            ${lp.tipe_pembayaran === "gaji_tetap" ? "Gaji Tetap" : "Per WO"}
          </span>
        </div>
        <div class="detail-item"><label>Periode</label><span>${BULAN[lp.bulan]} ${lp.tahun}</span></div>
        <div class="detail-item"><label>Status</label><span class="badge b-${lp.status}">${STATUS_LABEL[lp.status] || lp.status}</span></div>
      </div>`;

    // ── Render tabel detail WO ──
    if (dt && dt.length > 0) {
      let totalUpah = 0;
      html += `<div class="detail-wo-title">Rincian WO</div>`;
      html += `<table class="detail-wo-tbl"><thead><tr>`;

      if (lp.tipe_pembayayaran === "gaji_tetap") {
        html += `<th>Keterangan</th><th>Gaji Tetap</th><th>Upah Dihitung</th>`;
      } else {
        html += `<th>Jumlah WO</th><th>Jumlah Teknisi</th><th>Upah/WO</th><th>Upah Dihitung</th>`;
      }
      html += `</tr></thead><tbody>`;

      dt.forEach(d => {
        totalUpah += parseFloat(d.upah_dihitung) || 0;
        if (lp.tipe_pembayaran === "gaji_tetap") {
          html += `<tr>
            <td>${escHtml(d.keterangan || "—")}</td>
            <td class="td-mono">${rupiah(d.gaji_tetap)}</td>
            <td class="td-mono">${rupiah(d.upah_dihitung)}</td>
          </tr>`;
        } else {
          const upahPerWo = d.jumlah_teknisi > 0
            ? parseFloat(lp.upah_per_wo) / d.jumlah_teknisi
            : 0;
          html += `<tr>
            <td class="td-mono">${d.jumlah_wo}</td>
            <td class="td-mono">${d.jumlah_teknisi}</td>
            <td class="td-mono">${rupiah(upahPerWo)}</td>
            <td class="td-mono">${rupiah(d.upah_dihitung)}</td>
          </tr>`;
        }
      });

      html += `</tbody></table>
        <div class="detail-wo-total">
          <span class="detail-wo-total-label">Total Upah Dihitung</span>
          <span class="detail-wo-total-val">${rupiah(totalUpah)}</span>
        </div>`;
    }

    body.innerHTML = html;

    // Tampilkan footer kirim hanya jika masih draft
    if (lp.status === "draft") {
      const selAp = document.getElementById("modal-sel-ap");
      selAp.innerHTML = '<option value="">Pilih Admin Pusat...</option>' +
        adminPusatList.map(a => `<option value="${a.id}">${escHtml(a.nama)}</option>`).join("");
      ftr.style.display = "flex";
    }
  }

  function tutupModal(e) {
    // Tutup hanya jika klik overlay (bukan isi modal)
    if (e && e.target !== document.getElementById("modal-overlay")) return;
    document.getElementById("modal-overlay").classList.remove("show");
    document.body.style.overflow = "";
    modalLaporanId = null;
  }

  // ── Kirim langsung dari baris tabel (shortcut) ─────────────────────────
  async function bukaKirim(id, e) {
    if (e) e.stopPropagation();
    // Buka modal detail langsung
    await bukaDetail(id);
    // Scroll ke footer
    setTimeout(() => {
      document.getElementById("modal-ftr")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 200);
  }

  // ── Kirim dari dalam modal ─────────────────────────────────────────────
  async function kirimDariModal() {
    const admin_pusat_id = document.getElementById("modal-sel-ap").value;
    if (!admin_pusat_id) {
      showToast("Pilih Admin Pusat tujuan terlebih dahulu", false);
      return;
    }

    const btn = document.getElementById("btn-modal-kirim");
    btn.disabled = true;
    btn.textContent = "Mengirim...";

    const data = await apiFetch(`/admin-cabang/laporan/${modalLaporanId}/kirim`, {
      method: "PATCH",
      body: JSON.stringify({ admin_pusat_id }),
    });

    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Kirim`;

    if (!data?.success) {
      showToast(data?.message || "Gagal mengirim laporan", false);
      return;
    }

    showToast("Laporan berhasil dikirim ke admin pusat!");
    tutupModal();
    loadLaporan();
  }

  // ════════════════════════════════════════════════════════
  // MODAL KONFIRMASI HAPUS
  // ════════════════════════════════════════════════════════
  function konfirmasiHapus(id, namaTek, e) {
    if (e) e.stopPropagation();
    hapusTargetId = id;
    document.getElementById("confirm-desc").textContent =
      `Laporan #${id} atas nama "${namaTek}" akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.`;
    document.getElementById("confirm-overlay").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function tutupConfirm() {
    document.getElementById("confirm-overlay").classList.remove("show");
    document.body.style.overflow = "";
    hapusTargetId = null;
  }

  async function eksekusiHapus() {
    if (!hapusTargetId) return;
    const btn = document.getElementById("btn-confirm-hapus");
    btn.disabled = true;
    btn.textContent = "Menghapus...";

    const data = await apiFetch(`/admin-cabang/laporan/${hapusTargetId}`, { method: "DELETE" });

    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> Ya, Hapus`;

    if (!data?.success) {
      tutupConfirm();
      showToast(data?.message || "Gagal menghapus laporan", false);
      return;
    }

    showToast("Laporan berhasil dihapus.");
    tutupConfirm();
    loadLaporan();
  }

  // ── ESC untuk tutup modal ──────────────────────────────────────────────
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (document.getElementById("confirm-overlay").classList.contains("show")) {
      tutupConfirm();
    } else if (document.getElementById("modal-overlay").classList.contains("show")) {
      tutupModal({ target: document.getElementById("modal-overlay") });
    }
  });

  // ── Escape HTML ────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ── Init ──────────────────────────────────────────────────────────────
  Promise.all([loadAdminPusat(), loadLaporan()]);
</script>
</body>
</html>
